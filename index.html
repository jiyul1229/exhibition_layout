  const t = a < 1;
  for (const o of ud.alphaMeshes) {                  // 재질은 매번 o.material로 읽어서, 재질이 교체돼도 안전
    const m = o.material;
    if (m.transparent !== t) m.transparent = t;
    m.opacity = a;
  }
}

/* ---------- 애니메이션 루프 ---------- */
const goalPos = new THREE.Vector3(), goalLook = new THREE.Vector3();
const lookNow = new THREE.Vector3(0, EYE_H, -10);   // 현재 바라보는 지점 (부드러운 이동용)
let goalFov = 60;
camera.position.set(0, EYE_H, 0);

let lastT = performance.now();
const camDir = new THREE.Vector3();  let lastHd = 1e9;   // 나침반용: 카메라 방향 / 마지막으로 표시한 각도
const cDisc = $('cDisc'), cLetters = [...cDisc.querySelectorAll('text')];
{                                                    // 나침반 눈금: 5°마다 짧은 선, 15°마다 중간, 45°마다 긴 선
  const NS = 'http://www.w3.org/2000/svg', g = document.createElementNS(NS, 'g');
  g.setAttribute('stroke', '#d8bd7a');
  for (let a = 0; a < 360; a += 5) {
    const len = a % 45 === 0 ? 5 : a % 15 === 0 ? 3.4 : 2, l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 50);  l.setAttribute('x2', 50);  l.setAttribute('y1', 6.5);  l.setAttribute('y2', 6.5 + len);
    l.setAttribute('stroke-width', a % 45 === 0 ? 0.9 : 0.5);  l.setAttribute('transform', `rotate(${a} 50 50)`);
    g.appendChild(l);
  }
  cDisc.insertBefore(g, cDisc.firstChild);
}
function setCompass(hd) {                            // 나침반 판을 돌리고, 글자는 반대로 돌려 항상 바로 서 있게 함
  cDisc.setAttribute('transform', `rotate(${(-hd).toFixed(1)} 50 50)`);
  cLetters.forEach(t => t.setAttribute('transform', `rotate(${hd.toFixed(1)} ${t.getAttribute('x')} ${t.getAttribute('y')})`));
}
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000);  lastT = now;   // 프레임 간격(초)

  // 0) 방향키 입력 처리
  const key = (...c) => c.some(k => keys.has(k));
  const fwd = (key('ArrowUp', 'KeyW') ? 1 : 0) - (key('ArrowDown', 'KeyS') ? 1 : 0);
  const str = (key('ArrowRight', 'KeyD') ? 1 : 0) - (key('ArrowLeft', 'KeyA') ? 1 : 0);
  if (mode === 'center' && (fwd || str)) {           // 걷기: 보고 있는 방향(yaw) 기준으로 앞뒤·좌우 이동
    const sp = WALK_SPEED * dt / Math.hypot(fwd, str);
    const mx = (-Math.sin(yaw) * fwd + Math.cos(yaw) * str) * sp, mz = (-Math.cos(yaw) * fwd - Math.sin(yaw) * str) * sp;
    const lx = Math.max(0, roomW / 2 - 0.4), lz = Math.max(0, roomD / 2 - 0.4), stuck = blocked(walk.x, walk.z);
    const nx = clamp(walk.x + mx, -lx, lx), nz = clamp(walk.z + mz, -lz, lz);
    if (stuck || !blocked(nx, walk.z)) walk.x = nx;  // 소품에 막히면 그 방향만 멈추고 옆으로는 미끄러짐
    if (stuck || !blocked(walk.x, nz)) walk.z = nz;
  } else if (mode === 'top') {                       // 3D: 좌우는 방 둘레 돌기, 위아래는 확대·축소
    orbit.yaw += str * 1.2 * MOVE_BOOST * dt;
    orbit.zoom = clamp(orbit.zoom * Math.exp(-fwd * 0.9 * MOVE_BOOST * dt), 0.2, 1.4);
  } else if (mode === 'wall') {                      // 2D: 좌우는 벽을 따라 이동, 위아래는 확대·축소
    view2D.px += str * view2D.wpp * 400 * MOVE_BOOST * dt;
    view2D.zoom = clamp(view2D.zoom * Math.exp(-fwd * 0.9 * MOVE_BOOST * dt), 0.15, 1.6);
  }

  // 1) 모드별 카메라 목표 위치 / 시선 / 화각 계산
  if (mode === 'top') {                              // 3D: 방 중심(0, 1.5, 0)을 도는 카메라
    const d = orbitBase() * orbit.zoom, cp = Math.cos(orbit.pitch);
    goalPos.set(Math.sin(orbit.yaw) * cp * d, 1.5 + Math.sin(orbit.pitch) * d, Math.cos(orbit.yaw) * cp * d);
    goalLook.set(0, 1.5, 0);
    goalFov = 50;
    walls.forEach((w, i) => { topDots[i] = -Math.cos(w.group.rotation.y - orbit.yaw); });   // 벽 바깥쪽 방향과 카메라 방향의 일치도
    let best = topSide;
    topDots.forEach((v, i) => { if (v > topDots[best] + 0.05) best = i; });                // 카메라 정면 벽 (경계에서 깜빡이지 않게 여유를 둠)
    if (best !== topSide) {
      topSide = best;
      [...angleMenu.children].forEach(b => b.classList.toggle('on', +b.dataset.i === topSide));
    }
  } else if (mode === 'wall') {                      // 2D: 선택한 벽 정면에서 수평으로 바라봄
    const g = walls[wallView].group, d = dims[wallView];
    goalFov = 40;
    const dist = Math.max(d.h * 1.3, d.w * 1.15 / camera.aspect) / (2 * Math.tan(THREE.MathUtils.degToRad(goalFov / 2))) * view2D.zoom;   // 휠로 가까이/멀리
    const nx = Math.sin(g.rotation.y), nz = Math.cos(g.rotation.y);   // 벽이 바라보는(방 안쪽) 방향
    view2D.px = clamp(view2D.px, -d.w, d.w);  view2D.py = clamp(view2D.py, -d.h / 2, d.h / 2);
    view2D.wpp = 2 * dist * Math.tan(THREE.MathUtils.degToRad(goalFov / 2)) / innerHeight;   // 화면 1px이 벽 위에서 몇 m인지 (드래그 이동량 계산용)
    const rx = nz, rz = -nx;                                          // 화면 오른쪽 방향 (벽을 따라가는 방향)
    goalLook.set(g.position.x + rx * view2D.px, d.h / 2 + view2D.py, g.position.z + rz * view2D.px);   // 정면을 유지한 채 평행 이동
    goalPos.set(goalLook.x + nx * dist, goalLook.y, goalLook.z + nz * dist);
  } else {                                           // 중앙 시점: yaw/pitch로 시선 방향 계산
    goalPos.set(walk.x, EYE_H, walk.z);
    goalFov = userFov;
    goalLook.set(
      goalPos.x - Math.sin(yaw) * Math.cos(pitch),
      goalPos.y + Math.sin(pitch),
      goalPos.z - Math.cos(yaw) * Math.cos(pitch)
    ).sub(goalPos).multiplyScalar(10).add(goalPos);
  }

  // 2) 목표를 향해 부드럽게 이동 (lerp) → 시점 전환 애니메이션
  const k = mode === 'center' ? 0.12 : dragging ? 0.25 : mode === 'top' ? 0.09 : 0.07;   // 드래그 중엔 즉각 반응
  camera.position.lerp(goalPos, k);
  lookNow.lerp(goalLook, k);
  camera.lookAt(lookNow);
  camera.getWorldDirection(camDir);                  // 나침반: 카메라가 바라보는 방향이 위쪽, 북쪽(-z)이 그 기준으로 어디인지 표시
  const hd = Math.atan2(camDir.x, -camDir.z) * 180 / Math.PI;
  if (Math.abs(hd - lastHd) > 0.05) { setCompass(hd); lastHd = hd; }
  // 아주 작은 벽(1cm)에 바짝 다가가도 잘리지 않도록 가까운 한계(near)를 거리에 맞춰 조절
  const near = clamp(camera.position.distanceTo(lookNow) * 0.05, 0.001, 0.1);
  // far도 방 크기에 맞춰 줄여 깊이 정밀도(near:far 비율)를 지킴 → 액자가 벽에 붙어 있어도 깜빡임(z-fighting)이 줄어듦
  const far = camera.position.length() + Math.hypot(roomW, roomD, roomH) * 0.6 + 1;
  if (near !== camera.near || Math.abs(far - camera.far) > camera.far * 0.02) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
  if (Math.abs(goalFov - camera.fov) > 0.01) { camera.fov += (goalFov - camera.fov) * k; camera.updateProjectionMatrix(); }

  // 3) 벽 페이드: 3D 모드에서 선택한 방향의 벽만 투명, 나머지는 불투명
  alphas.forEach((a, i) => {
    const target = (mode === 'top' && (topSide === i || topDots[i] > 0.4)) ? 0 : 1;   // 카메라 쪽을 향한 벽은 투명 (대각선이면 두 벽)
    const stale = alphas[i] < 1 && walls[i].group.userData.alphaVer !== wallTreeVer;   // 투명한 벽에 새 액자가 붙으면 그 액자도 투명하게
    if (a === target && !stale) return;
    let na = a + (target - a) * 0.1;
    if (Math.abs(target - na) < 0.01) na = target;
    alphas[i] = na;
    applyAlpha(walls[i].group, na);
  });

  // 4) 표시 여부: 2D 모드는 선택한 벽(액자 포함)만, 바닥/천장/바탕 벽은 숨김
  walls.forEach((w, i) => {
    w.group.visible = mode === 'wall' ? i === wallView : alphas[i] > 0.02;
    w.shell.visible = mode !== 'wall';
  });
  const cGoal = mode === 'top' ? 0 : 1;               // 천장: 3D 시점이면 서서히 사라지고, 중앙 시점으로 돌아오면 다시 나타남
  if (ceilA !== cGoal) {
    ceilA += (cGoal - ceilA) * 0.1;  if (Math.abs(cGoal - ceilA) < 0.01) ceilA = cGoal;
    const t = ceilA < 1;
    ceilMats.forEach(m => { if (m.transparent !== t) m.transparent = t; m.opacity = ceilA; });
  }
  floor.visible = mode !== 'wall';
  ceiling.visible = mode !== 'wall' && ceilA > 0.02;
  props.forEach(p => p.group.visible = mode !== 'wall');   // 2D 벽면 보기에서는 바닥 소품 숨김

  renderer.render(scene, camera);
}
animate();

/* ---------- 세이브 / 로드 ----------
 * [세이브]: 지금 전시관(벽 크기·상하연동·바닥·천장·벽지·액자/문/2D오브젝트·바닥 오브젝트·내가 고른 이미지)을
 *           .json 파일 하나로 내려받습니다. 내가 올린 이미지는 파일 안에 함께 들어가서 나중에 그대로 복원돼요.
 * [로드]:   저장해 둔 .json 파일을 고르면 지금 전시관이 그 내용으로 바뀝니다. (친구에게 파일을 보내서 열어 볼 수도 있어요)
 * 기본 액자 그림처럼 인터넷 주소로 불러온 이미지는 주소만 저장하므로, 로드할 때 인터넷이 연결돼 있어야 해요. */
const SAVE_APP = 'virtual-art-gallery', SAVE_VER = 1;
const saveMsg = $('saveMsg');
const say = t => { saveMsg.textContent = t; saveMsg.hidden = !t; };

function imgToDataURL(src, maxSide = 1600) {         // 내가 올린 이미지(임시 주소)를 파일에 담을 수 있는 글자(data URL)로 바꿈. 너무 크면 줄여서 용량 절약
  return new Promise(res => {
    if (!src || !src.startsWith('blob:')) return res(src || null);   // data: 이거나 인터넷 주소면 그대로
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k));  c.height = Math.max(1, Math.round(im.height * k));
      const g = c.getContext('2d');  g.fillStyle = '#fff';  g.fillRect(0, 0, c.width, c.height);  g.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.88));
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}

async function collectState() {                      // 지금 전시관 상태를 하나의 객체로 모으기
  const num = v => Math.round(v * 10000) / 10000;
  const data = {
    app: SAVE_APP, version: SAVE_VER, savedAt: new Date().toISOString(),
    dims: dims.map(d => ({ w: d.w, h: d.h })), link: [link[0], link[1]],
    floor: curFloor, ceiling: curCeil,
    wallpapers: await Promise.all(walls.map(w => w.hasWp ? imgToDataURL(w.wpSrc) : null)),
    frames: await Promise.all(frames.map(async f => ({
      type: f.item ? 'item' : f.kind === 'door' ? 'door' : 'frame', key: f.item ? f.kind : undefined,
      wall: f.i, x: num(f.group.position.x), y: num(f.group.position.y), w: num(f.fw), h: num(f.fh), name: f.name,
      src: (f.item || f.kind === 'door') ? undefined : await imgToDataURL(f.src)
    }))),
    props: props.map(p => ({ kind: p.kind, label: p.label, name: p.name, w: num(p.w), h: num(p.h),
      x: num(p.group.position.x), z: num(p.group.position.z), rot: num(p.group.rotation.y) }))
  };
  return data;
}

$('saveDo').onclick = async () => {
  const btn = $('saveDo');  btn.disabled = true;  say('저장하는 중...');
  try {
    const blob = new Blob([JSON.stringify(await collectState())], { type: 'application/json' });
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gallery-save-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    document.body.appendChild(a);  a.click();  a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say('저장했어요! 다운로드 폴더를 확인하세요.');
  } catch (e) { console.error(e);  say('저장에 실패했어요.'); }
  btn.disabled = false;
};

function resetWallpaper(i) {                         // 벽지를 기본 다마스크 무늬로 되돌림
  const w = walls[i], m = w.wall.material;
  if (m.map) m.map.dispose();
  m.map = repeatTex(damaskCvs);  m.color.set(0xffffff);  m.needsUpdate = true;
  w.hasWp = false;  w.wpSrc = null;  w.deco.group.visible = true;
  fitWallpaper(w);
  if (wpBlobs[i]) { URL.revokeObjectURL(wpBlobs[i]);  wpBlobs[i] = null; }
  wpStatus[i].textContent = '기본 벽지';
}

function applyState(d) {                             // 저장된 내용으로 전시관 다시 만들기
  closeObj();  selectFrame(null);  selectProp(null);
  // 1) 지금 있는 오브젝트 모두 지우고 번호 새로 시작
  [...frames].forEach(removeFrame);  [...props].forEach(removeProp);
  frameSeq = 0;  doorSeq = 0;
  Object.keys(propNo).forEach(k => delete propNo[k]);  Object.keys(itemNo).forEach(k => delete itemNo[k]);
  // 2) 벽 크기 · 상하연동
  d.dims.forEach((v, i) => { if (dims[i] && isFinite(v.w) && isFinite(v.h)) { dims[i].w = clamp(v.w, 0.01, 100);  dims[i].h = clamp(v.h, 0.01, 40); } });
  dims.forEach(x => x.h = dims[0].h);
  if (Array.isArray(d.link)) { link[0] = !!d.link[0];  link[1] = !!d.link[1]; }
  updateRoom();  selectWall(selWall);  saveDims();  saveLink();
  // 3) 바닥 · 천장
  if (FLOORS[d.floor]) setFloor(d.floor);
  if (CEILINGS[d.ceiling]) setCeiling(d.ceiling);
  // 4) 벽지
  walls.forEach((w, i) => {
    const src = (d.wallpapers || [])[i];
    if (src) { loadWallpaper(i, src, ok => { wpStatus[i].textContent = ok ? '불러온 벽지' : '기본 벽지'; });  w.wpSrc = src; }
    else resetWallpaper(i);
  });
  // 5) 액자 · 문 · 2D오브젝트 (저장된 벽에 그대로 만들기)
  (d.frames || []).forEach(o => {
    if (!(o.wall >= 0 && o.wall < 4)) return;
    forceWall = o.wall;
    try {
      const w = o.w * 100, h = o.h * 100;
      if (o.type === 'door') createDoor(w, h, o.name);
      else if (o.type === 'item' && WALL_ITEMS[o.key]) createWallItem(o.key, w, h, o.name);
      else if (o.type === 'frame') createFrame(w, h, o.name, o.src || undefined);
      else return;
      const f = frames[frames.length - 1];
      placeFrame(f, o.wall, o.x, o.y);
      if (f.entry && o.src && o.src.startsWith('data:')) f.entry.querySelector('span').textContent = '불러온 이미지';
    } finally { forceWall = null; }
  });
  // 6) 바닥 오브젝트
  (d.props || []).forEach(o => {
    createProp(o.kind, o.label, o.w * 100, o.h * 100, o.name);
    const p = props[props.length - 1];
    p.group.rotation.y = o.rot || 0;
    placeProp(p, o.x, o.z);
  });
  selectFrame(null);  selectProp(null);
}

$('loadDo').onclick = () => $('loadFile').click();
$('loadFile').addEventListener('change', () => {
  const file = $('loadFile').files[0];
  $('loadFile').value = '';                          // 같은 파일을 다시 골라도 반응하도록 초기화
  if (!file) return;
  const rd = new FileReader();
  rd.onerror = () => say('파일을 읽을 수 없어요.');
  rd.onload = () => {
    let d;
    try {
      d = JSON.parse(rd.result);
      if (!d || d.app !== SAVE_APP || !Array.isArray(d.dims) || d.dims.length !== 4) throw new Error('bad');
    } catch (e) { say('올바른 세이브 파일이 아니에요.');  return; }
    if ((frames.length || props.length) && !confirm('지금 전시관이 불러온 내용으로 바뀌어요. 계속할까요?')) { say('');  return; }
    try { applyState(d);  say('불러왔어요!'); }
    catch (e) { console.error(e);  say('불러오는 중 문제가 생겼어요.'); }
  };
  rd.readAsText(file);
});
$('saveBtn').addEventListener('click', () => {       // 버튼: 세이브 / 로드 패널 열기/닫기
  $('savePanel').hidden = !$('savePanel').hidden;
  $('saveBtn').classList.toggle('on', !$('savePanel').hidden);
  if ($('savePanel').hidden) say('');
});
say('');

/* ---------- 조작 안내 문구: 평상시에만 보이고, 버튼으로 패널·메뉴를 열거나 시점을 바꾸면 숨김 ---------- */
const helpEl = $('help');
const helpBusy = ['sizePanel', 'uploads', 'savePanel', 'objMenu', 'objForm', 'angleMenu', 'dirMenu'];   // 이 중 하나라도 열려 있으면 '평상시'가 아님
function updateHelp() {
  const hide = mode !== 'center' || helpBusy.some(id => !$(id).hidden);
  if (helpEl.hidden !== hide) helpEl.hidden = hide;   // 값이 바뀔 때만 적용 (관찰자가 자기 자신을 계속 깨우지 않게)
}
new MutationObserver(updateHelp).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });   // 패널이 열리고 닫힐 때마다 확인
updateHelp();

/* ---------- 창 크기 변경 대응 ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
