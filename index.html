<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 미술 전시관</title>
<style>
  /* ===== 기본 레이아웃: 화면 전체를 3D 캔버스가 차지 ===== */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; color: #1d2430; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  [hidden] { display: none !important; }   /* hidden 속성이 display 설정에 덮어쓰이지 않게 */

  /* ===== 미술관 작품 설명판 느낌의 패널 ===== */
  .panel { position: fixed; background: #f6f6f3; border: 1px solid #cfd0cc; border-radius: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); padding: 14px 16px; }

  /* ===== 버튼 A(3D) · B(2D) · C(크기 조절)는 모두 같은 모양 ===== */
  .mbtn { padding: 9px 14px; min-width: 64px; border: 1px solid #111; border-radius: 3px; background: #fff; color: #111;
    font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .mbtn:hover { background: #ececec; }
  .mbtn.on { box-shadow: inset 0 0 0 2px #111, 0 4px 14px rgba(0,0,0,.35); }   /* 켜진(선택된) 상태 */
  .mbtn:focus-visible, .up:focus-within, .tabs button:focus-visible { outline: 2px solid #888; outline-offset: 2px; }

  /* ===== 좌측 상단: 버튼 C + 벽별 크기 조절 패널 ===== */
  #topLeft { position: fixed; top: 16px; left: 16px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }           /* 버튼 C, D를 나란히 */
  #topLeft .panel { width: 230px; box-sizing: border-box; }
  #sizePanel, #uploads, #savePanel { position: static; margin-top: 8px; }
  #topLeft #sizePanel { width: min(256px, calc(100vw - 32px)); }       /* 상하연동 칸이 들어가도록 조금 넓게 */
  #savePanel { display: flex; flex-direction: column; gap: 8px; }
  #savePanel[hidden] { display: none; }
  #savePanel .mbtn { width: 100%; box-shadow: none; }
  #savePanel .mbtn:disabled { opacity: .6; cursor: wait; }
  .lnk { display: inline-flex; align-items: center; gap: 4px; margin: 0 6px; font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; }
  .lnk input { margin: 0; width: 14px; height: 14px; accent-color: #111; cursor: pointer; }
  #numW { width: 56px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 6px 0; border: 1px solid #111; border-radius: 3px; background: #fff; color: #111;
    font-size: 13px; cursor: pointer; }
  .tabs button.on { font-weight: 700; box-shadow: inset 0 0 0 2px #111; }
  .row { margin-bottom: 12px; font-size: 13px; }
  .row .lab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .num { font-weight: 700; color: #111; }                    /* 숫자 + 단위(m) */
  .num input { width: 74px; padding: 1px 2px; border: 0; border-bottom: 1px solid #111; background: transparent;
    font: inherit; color: #111; text-align: right; }            /* 클릭해서 직접 입력 가능 */
  .num input:focus { outline: 2px solid #888; background: #fff; }
  input[type=range] { width: 100%; accent-color: #111; }
  .hint { margin: 0; font-size: 12px; color: #626870; line-height: 1.5; }
  #help { margin-top: 10px; color: #f1f1ee; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* ===== 좌측 하단: 버튼 A / B, B를 누르면 위로 동·서·남·북 메뉴가 열림 ===== */
  #views { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; }
  .rel { position: relative; }
  #dirMenu, #angleMenu { position: absolute; bottom: calc(100% + 8px); left: 0; display: flex; flex-direction: column;
    gap: 6px; padding: 8px; }
  #dirMenu .mbtn, #angleMenu .mbtn { width: 96px; font-size: 14px; box-shadow: none; }
  #dirMenu .mbtn.on, #angleMenu .mbtn.on { box-shadow: inset 0 0 0 2px #111; }

  /* ===== 버튼 D: 벽면별 이미지 선택 패널 (input은 숨기고 label을 버튼처럼 사용) ===== */
  #uploads { display: flex; flex-direction: column; gap: 8px; }
  .up { display: flex; flex-direction: column; padding: 8px 10px; border: 1px solid #111; border-radius: 3px;
    background: #fff; color: #111; cursor: pointer; font-size: 12px; }
  .up:hover { background: #ececec; }
  .up input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .up b { font-size: 13px; }
  .up span { color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #uploads .tabs { margin-bottom: 0; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .wrow { display: flex; gap: 6px; }                         /* 벽지 한 줄: 파일 선택 */
  .wrow .up { flex: 1; min-width: 0; }
  /* ===== 우측 상단: 오브젝트 버튼 + 메뉴 + 선택한 액자 패널 ===== */
  #topRight { position: fixed; top: 16px; right: 16px; width: 220px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 8px; }
  #topRight .panel { position: static; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  #topRight .panel .mbtn { width: 100%; box-shadow: none; }
  /* 오브젝트 메뉴: 버튼 5개만 보이고 나머지는 스크롤/드래그로 내려서 선택 (높이는 JS가 5개 기준으로 계산) */
  #topRight #objMenu { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; cursor: grab; touch-action: pan-y; }
  #objMenu .mbtn { flex: none; }
  #rotBox { display: flex; flex-direction: column; gap: 8px; }
  .rotbtns { display: flex; gap: 4px; flex: 1; }
  #topRight .panel .rotbtns .mbtn { min-width: 0; padding: 6px 0; font-size: 13px; flex: 1; }
  #objMenu.dragging { cursor: grabbing; user-select: none; }
  .up.sel { box-shadow: inset 0 0 0 2px #111; }                 /* 선택한 액자의 이미지 버튼 표시 */
  .num input { -moz-appearance: textfield; appearance: textfield; }   /* 위아래 화살표를 없애 'cm'가 숫자 바로 뒤에 붙어 보이게 */
  .num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #objName { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #111; border-radius: 3px;
    background: #fff; color: #111; font-size: 13px; }
  .num { white-space: nowrap; }
  .orow { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }   /* 오브젝트 폼 한 줄: 글자 + 입력칸 (+ cm) */
  .orow label { width: 64px; flex: none; }
  .orow #objName { width: auto; flex: 1; min-width: 0; }
  .orow .num { display: flex; align-items: center; gap: 4px; }
  .tabs { flex-wrap: wrap; }                                     /* 탭이 3개라 좁으면 줄바꿈 */
  .tabs button { flex: 1 1 auto; padding: 6px 6px; font-size: 12px; white-space: nowrap; }
  #floorList, #ceilList { display: flex; flex-direction: column; gap: 6px; }
  .fbtn { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #111; border-radius: 3px;
    background: #fff; color: #111; cursor: pointer; font-size: 13px; text-align: left; }
  .fbtn:hover { background: #ececec; }
  .fbtn.on { box-shadow: inset 0 0 0 2px #111; font-weight: 700; }
  .fbtn i { width: 18px; height: 18px; border: 1px solid #777; border-radius: 2px; flex: none; }   /* 재질 색 견본 */
  /* ===== 우측 하단: 나침반 (황동 테두리 + 짙은 남색 판. 글자는 항상 바로 서 있음) ===== */
  #compass { position: fixed; right: 16px; bottom: 16px; width: 100px; height: 100px; pointer-events: none; user-select: none;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,.5)); }
  #compass svg { width: 100%; height: 100%; display: block; }
  #compass text { font-family: Georgia, 'Times New Roman', 'Noto Serif', serif; font-weight: 700; font-size: 10px;
    fill: #e9dfc4; text-anchor: middle; dominant-baseline: central; }
  #compass text.n { fill: #e0584a; }
  #topRight .btnrow { display: flex; gap: 8px; }                  /* [수정][삭제] / [생성][취소] 나란히 */
  #topRight .btnrow .mbtn { min-width: 0; padding-left: 4px; padding-right: 4px; }
  @media (max-width: 560px) { #topLeft .panel { width: 200px; } }
</style>
</head>
<body>

<!-- 좌측 상단: 버튼 C(크기 조절) → 누르면 벽별 가로/세로 슬라이더 패널이 열림 -->
<div id="topLeft">
  <div class="btnrow">
    <button class="mbtn" id="sizeBtn">크기 조절</button>   <!-- 버튼 C -->
    <button class="mbtn" id="imgBtn">이미지 선택</button>   <!-- 버튼 D -->
    <button class="mbtn" id="saveBtn">세이브 / 로드</button>   <!-- 버튼 E: 전시관 저장 · 불러오기 -->
  </div>
  <div class="panel" id="sizePanel" hidden>
    <div class="tabs" id="wallTabs"></div>
    <div class="row">
      <div class="lab"><label for="sliderW">가로 길이</label>
        <label class="lnk" id="linkLab" title="맞은편 벽의 가로 길이를 함께 바꿔요"><input type="checkbox" id="linkChk"><span>상하연동</span></label>
        <span class="num"><input type="number" id="numW" min="1" max="10000" step="1" aria-label="가로 길이(cm)"> cm</span></div>
      <input type="range" id="sliderW" min="1" max="10000" step="1">
    </div>
    <div class="row">
      <div class="lab"><label for="sliderH">세로 길이</label>
        <span class="num"><input type="number" id="numH" min="1" max="4000" step="1" aria-label="세로 길이(cm)"> cm</span></div>
      <input type="range" id="sliderH" min="1" max="4000" step="1">
    </div>
  </div>
  <!-- 버튼 D 패널: [액자이미지] [벽이미지] 선택 → 각각 동·서·남·북 버튼 4개(JS에서 생성) -->
  <div class="panel" id="uploads" hidden>
    <div class="tabs"><button id="tabWall">벽</button><button id="tabFrame" hidden>액자</button><button id="tabFloor">바닥</button><button id="tabCeil">천장</button></div>
    <div class="list" id="frameList" hidden></div>
    <div id="floorList" hidden></div>
    <div id="ceilList" hidden></div>
    <div class="list" id="wallList" hidden>
    </div>
  </div>
  <div class="panel" id="savePanel" hidden>
    <button class="mbtn" id="saveDo">세이브 (파일로 저장)</button>
    <button class="mbtn" id="loadDo">로드 (파일 불러오기)</button>
    <input type="file" id="loadFile" accept=".json,application/json" hidden>
    <p class="hint" id="saveMsg" hidden></p>
  </div>
  <p class="hint" id="help">드래그: 둘러보기 / 휠: 확대·축소 / 방향키(WASD): 이동</p>
</div>

<!-- 우측 상단: 오브젝트 버튼 → 목록에서 오브젝트 선택 → 크기 입력 → [생성]을 눌러야 만들어짐 -->
<div id="topRight">
  <button class="mbtn" id="objBtn">오브젝트</button>
  <div class="panel" id="objMenu" hidden></div>
  <div class="panel" id="objForm" hidden>
    <p class="hint" id="objFormTitle" style="margin:0"></p>
    <div class="orow"><label for="objName">이름</label><input type="text" id="objName" maxlength="20" autocomplete="off"></div>
    <div class="orow"><label for="objW" id="lblW">가로 길이</label>
      <span class="num"><input type="number" id="objW" min="5" max="1000" step="1" value="120"><span>cm</span></span></div>
    <div class="orow"><label for="objH" id="lblH">세로 길이</label>
      <span class="num"><input type="number" id="objH" min="5" max="400" step="1" value="80"><span>cm</span></span></div>
    <div id="rotBox" hidden>
      <div class="orow"><label for="objRot">회전</label>
        <input type="range" id="objRot" min="0" max="359" step="1" value="0" style="flex:1;min-width:0">
        <span class="num"><input type="number" id="objRotNum" min="0" max="359" step="1" value="0" style="width:40px"><span>°</span></span></div>
      <div class="orow"><label>방향</label>
        <div class="rotbtns"><button class="mbtn" data-deg="180">북</button><button class="mbtn" data-deg="90">동</button><button class="mbtn" data-deg="0">남</button><button class="mbtn" data-deg="270">서</button></div></div>
    </div>
    <div class="btnrow"><button class="mbtn" id="objCreate">생성</button><button class="mbtn" id="objCancel">취소</button></div>
  </div>
  <div class="panel" id="framePanel" hidden>
    <p class="hint" style="margin:0"><b id="frameName"></b></p>
    <div class="btnrow"><button class="mbtn" id="objEdit">수정</button><button class="mbtn" id="frameDel">삭제</button></div>
  </div>
</div>

<!-- 우측 하단: 나침반 (북=붉은 N. 지금 바라보는 방향이 위쪽의 작은 삼각형 쪽) -->
<div id="compass" aria-label="나침반">
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e3a6"/><stop offset=".45" stop-color="#b8892f"/><stop offset="1" stop-color="#6e4f17"/>
      </linearGradient>
      <radialGradient id="cDial" cx=".5" cy=".38" r=".75">
        <stop offset="0" stop-color="#2d3445"/><stop offset="1" stop-color="#0f1219"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="48.5" fill="url(#cGold)"/>
    <circle cx="50" cy="50" r="45.5" fill="none" stroke="#5a3f10" stroke-width=".7"/>
    <circle cx="50" cy="50" r="44.5" fill="url(#cDial)"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#b8892f" stroke-width=".4" opacity=".7"/>
    <g id="cDisc">
      <polygon points="62,38 55,50 62,62 50,55 38,62 45,50 38,38 50,45" fill="#8f7a45"/>
      <polygon points="50,26 55.5,44.5 74,50 55.5,55.5 50,74 44.5,55.5 26,50 44.5,44.5" fill="#e9dfc4" stroke="#8a6a24" stroke-width=".4"/>
      <polygon points="50,26 55.5,44.5 44.5,44.5" fill="#b3342a"/>
      <text class="n" x="50" y="19">N</text><text x="81" y="50">E</text><text x="50" y="81">S</text><text x="19" y="50">W</text>
      <circle cx="50" cy="50" r="3" fill="url(#cGold)" stroke="#4a3410" stroke-width=".4"/>
    </g>
    <polygon points="50,3.2 46.8,9 53.2,9" fill="#f6e3a6" stroke="#6e4f17" stroke-width=".3"/>
    <ellipse cx="38" cy="26" rx="20" ry="9" fill="#fff" opacity=".07" transform="rotate(-28 38 26)"/>
  </svg>
</div>

<!-- 좌측 하단: 버튼 A(3D 쿼터뷰), 버튼 B(2D 벽면 보기 - 방향 선택 메뉴는 JS에서 생성) -->
<div id="views">
  <div class="rel">
    <button class="mbtn" id="btn3D">3D</button>
    <div class="panel" id="angleMenu" hidden></div>   <!-- 3D 각도 4개(JS에서 생성) -->
  </div>
  <div class="rel">
    <button class="mbtn" id="btn2D">2D</button>
    <div class="panel" id="dirMenu" hidden></div>
  </div>
</div>

<!-- Three.js CDN (모듈이 아닌 일반 스크립트 버전이라 index.html을 더블클릭해도 동작) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
 * ★ 작품 이미지 설정 (여기만 바꾸면 기본 이미지가 교체됩니다)
 * 순서: [0] 북쪽 벽, [1] 동쪽 벽, [2] 남쪽 벽, [3] 서쪽 벽
 * Lorem Picsum의 id를 고정해서 매번 같은 사진이 나옵니다. (가로x세로 비율이 달라도 액자가 맞춰집니다)
 * ===================================================================== */
const artworkImages = [
  'https://picsum.photos/id/1015/1200/800',   // 북: 가로형
  'https://picsum.photos/id/1018/900/1200',   // 동: 세로형
  'https://picsum.photos/id/1039/1200/900',   // 남
  'https://picsum.photos/id/1043/1000/1000'   // 서: 정사각형
];

/* ---------- 기본 상수 ---------- */
const WALLS = [                                  // 벽 정보 (이름, 회전각)
  { name: '북쪽 벽', rotY: 0 },                   // 안쪽(+z)을 바라봄
  { name: '동쪽 벽', rotY: -Math.PI / 2 },        // 안쪽(-x)을 바라봄
  { name: '남쪽 벽', rotY: Math.PI },             // 안쪽(-z)을 바라봄
  { name: '서쪽 벽', rotY: Math.PI / 2 }          // 안쪽(+x)을 바라봄
];
const ROOM_H = 4.5;       // 벽 높이 기본값
const EYE_H = 1.7;        // 눈높이(중앙 시점 카메라 높이)
const FRAME_Y = 2.2;      // 액자 중심 높이(벽이 낮으면 자동으로 낮춰짐)
const MAX_W = 3.2, MAX_H = 2.4;   // 액자 안 이미지가 들어갈 수 있는 최대 크기(m)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ★ 벽별 크기 데이터 (순서: 북·동·남·서) — w: 가로 길이, h: 세로 길이(높이)
 * 벽마다 따로 저장되므로 한 벽을 바꿔도 다른 벽은 그대로 유지됩니다. */
const dims = [{ w: 4.43, h: ROOM_H }, { w: 12, h: ROOM_H }, { w: 4.43, h: ROOM_H }, { w: 12, h: ROOM_H }];
try {                      // 이전에 저장한 크기가 있으면 불러오기 (새로고침해도 유지)
  const saved = JSON.parse(localStorage.getItem('galleryDims2'));
  if (Array.isArray(saved) && saved.length === 4) saved.forEach((d, i) => {
    if (d && isFinite(d.w) && isFinite(d.h)) { dims[i].w = clamp(d.w, 0.01, 100); dims[i].h = clamp(d.h, 0.01, 40); }
  });
} catch (e) {}
dims.forEach(d => d.h = dims[0].h);   // 세로(높이)는 4면 연동: 저장값이 달라도 하나로 통일

let wallTreeVer = 0;      // 벽 그룹 안의 물체가 늘거나 줄거나 옮겨질 때마다 +1 (투명화 대상 목록 캐시 갱신용)
let roomW = 16, roomD = 12, roomH = ROOM_H;  // 벽 크기로부터 계산되는 방 전체 크기
let mode = 'center';      // 시점 모드: 'center'(중앙) | 'top'(3D 위에서 보기) | 'wall'(2D 한 벽만 보기)
let topSide = 2;         // 3D 모드에서 투명하게 숨길(= 카메라가 있는) 벽 번호 (0북 1동 2남 3서)
let wallView = 0;         // 2D 모드에서 보고 있는 벽 번호
let userFov = 60;         // 휠로 조절한 중앙 시점 화각
const orbit = { yaw: 0, pitch: 0.8, zoom: 1 };   // 3D 시점: 방 중심을 도는 카메라 (yaw 좌우 회전 / pitch 높이 각도 / zoom 거리 배율)
const walk = { x: 0, z: 0 };  const keys = new Set();   // 중앙 시점에서 걸어 다닌 위치 / 지금 눌려 있는 키

/* ---------- 렌더러 / 씬 / 카메라 ---------- */

/* ---------- 바닥 / 천장 ---------- */
// 바닥: 이미지 선택 → '바닥' 탭에서 재질을 고릅니다. 모든 재질은 캔버스로 즉석에서 그려 사용 (외부 파일 불필요)
// 텍스처 한 장(FN 픽셀)이 가로세로로 반복되므로, 가장자리가 자연스럽게 이어지도록 그립니다.
const TILE_M = 0.6, TILE_N = 4;                  // 포세린 타일 한 장의 크기(m) / 텍스처 한 장에 담는 타일 수(가로·세로 4장씩)
const FN = 1024;
const fc = document.createElement('canvas'); fc.width = fc.height = FN;
const fx = fc.getContext('2d');
const rnd = Math.random;
const gridLines = (n, color, w) => {             // 줄눈: n칸 격자선 (가장자리 선은 양쪽 끝에 그려서 이어 붙여도 같은 굵기)
  fx.strokeStyle = color;  fx.lineWidth = w;
  for (let i = 0; i <= n; i++) {
    fx.beginPath(); fx.moveTo(i * FN / n, 0); fx.lineTo(i * FN / n, FN); fx.stroke();
    fx.beginPath(); fx.moveTo(0, i * FN / n); fx.lineTo(FN, i * FN / n); fx.stroke();
  }
};
const blob = (x, y, r, rgb, a) => {              // 부드러운 얼룩 (9방향으로 그려 가장자리가 이어지게)
  for (const dx of [-FN, 0, FN]) for (const dy of [-FN, 0, FN]) {
    const g = fx.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
    g.addColorStop(0, `rgba(${rgb},${a})`);  g.addColorStop(1, `rgba(${rgb},0)`);
    fx.fillStyle = g;  fx.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
  }
};
const speckle = (n, rgbA, rgbB, maxA, big) => {   // 잔 얼룩(질감)
  for (let i = 0; i < n; i++) {
    fx.fillStyle = `rgba(${rnd() < 0.5 ? rgbA : rgbB},${rnd() * maxA})`;
    fx.fillRect(rnd() * FN, rnd() * FN, 1 + rnd() * big, 1 + rnd() * big);
  }
};

function drawTile() {                            // 1) 포세린 타일: 타일마다 밝기가 조금씩 다름 + 줄눈
  const tp = FN / TILE_N;
  for (let r = 0; r < TILE_N; r++) for (let c = 0; c < TILE_N; c++) {
    fx.fillStyle = `hsl(40, 6%, ${74 + rnd() * 6}%)`;
    fx.fillRect(c * tp, r * tp, tp, tp);
  }
  speckle(TILE_N * TILE_N * 260, '90,85,75', '90,85,75', 0.07, 6);
  gridLines(TILE_N, '#85827b', 5);
}
function drawWood(hue, sat, light) {             // 2·3) 원목 마루: 판자 16줄, 줄마다 이음새 위치가 다름
  const rows = 16, rh = FN / rows, pw = FN / 2;
  for (let r = 0; r < rows; r++) {
    const off = rnd() * FN;
    for (let k = 0; k < 2; k++) {
      const x = (off + k * pw) % FN, y = r * rh, col = `hsl(${hue + rnd() * 6 - 3}, ${sat}%, ${light + rnd() * 8 - 4}%)`;
      const plank = ox => {
        fx.fillStyle = col;  fx.fillRect(ox, y, pw, rh);
        for (let g = 0; g < 10; g++) {           // 나뭇결
          const gy = y + rnd() * rh;
          fx.strokeStyle = `rgba(60,35,15,${0.05 + rnd() * 0.08})`;  fx.lineWidth = 1 + rnd() * 1.5;
          fx.beginPath(); fx.moveTo(ox, gy); fx.lineTo(ox + pw, gy + (rnd() - 0.5) * 6); fx.stroke();
        }
        fx.strokeStyle = 'rgba(30,18,8,0.55)';  fx.lineWidth = 2;  fx.strokeRect(ox + 1, y + 1, pw - 2, rh - 2);   // 판자 사이 틈
      };
      plank(x);  if (x + pw > FN) plank(x - FN);
    }
  }
}
function drawConcrete() {                        // 4) 폴리싱 콘크리트: 은은한 얼룩 + 신축줄눈
  fx.fillStyle = 'hsl(210, 4%, 60%)';  fx.fillRect(0, 0, FN, FN);
  for (let i = 0; i < 45; i++) blob(rnd() * FN, rnd() * FN, 80 + rnd() * 160, rnd() < 0.5 ? '255,255,255' : '40,40,45', 0.06 + rnd() * 0.07);
  speckle(5000, '255,255,255', '30,30,35', 0.09, 2);
  gridLines(2, 'rgba(40,40,45,0.45)', 3);
}
function drawMarble() {                          // 5) 흰 대리석: 구름무늬 + 회색 결
  fx.fillStyle = '#ece9e4';  fx.fillRect(0, 0, FN, FN);
  for (let i = 0; i < 40; i++) blob(rnd() * FN, rnd() * FN, 100 + rnd() * 200, rnd() < 0.5 ? '255,255,255' : '150,150,160', 0.08 + rnd() * 0.1);
  for (let v = 0; v < 7; v++) {
    let x = rnd() * FN, y = rnd() * FN, a = rnd() * 6.28;
    const pts = Array.from({ length: 40 }, () => { a += (rnd() - 0.5) * 0.9; x += Math.cos(a) * 30; y += Math.sin(a) * 30; return [x, y]; });
    const lw = 1 + rnd() * 2, al = 0.18 + rnd() * 0.2;
    for (const dx of [-FN, 0, FN]) for (const dy of [-FN, 0, FN]) {
      fx.strokeStyle = `rgba(95,95,110,${al})`;  fx.lineWidth = lw;
      fx.beginPath(); pts.forEach(([px, py], k) => k ? fx.lineTo(px + dx, py + dy) : fx.moveTo(px + dx, py + dy)); fx.stroke();
    }
  }
}
function drawChecker() {                         // 6) 흑백 체크 대리석: 미술관의 고전적인 바닥
  const n = 4, tp = FN / n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    fx.fillStyle = (r + c) % 2 ? `hsl(220, 6%, ${14 + rnd() * 5}%)` : `hsl(40, 12%, ${90 + rnd() * 4}%)`;
    fx.fillRect(c * tp, r * tp, tp, tp);
  }
  for (let i = 0; i < 30; i++) blob(rnd() * FN, rnd() * FN, 60 + rnd() * 120, rnd() < 0.5 ? '255,255,255' : '120,120,130', 0.06);
  gridLines(n, 'rgba(0,0,0,0.35)', 3);
}

// 재질 목록: name 버튼 이름 / swatch 색 견본 / size 텍스처 한 장의 실제 크기(m) / rough 거칠기(작을수록 반짝) / metal / draw 그리는 함수
const FLOORS = [
  { name: '포세린 타일',     swatch: '#bfbcb5', size: TILE_M * TILE_N, rough: 0.28, metal: 0.05, draw: drawTile },
  { name: '밝은 원목 마루',  swatch: '#c9985a', size: 2.4, rough: 0.55, metal: 0,    draw: () => drawWood(32, 45, 58) },
  { name: '짙은 원목 마루',  swatch: '#5a3a24', size: 2.4, rough: 0.5,  metal: 0,    draw: () => drawWood(22, 40, 28) },
  { name: '폴리싱 콘크리트', swatch: '#9a9da2', size: 2.4, rough: 0.35, metal: 0.1,  draw: drawConcrete },
  { name: '흰 대리석',       swatch: '#ece9e4', size: 3.0, rough: 0.12, metal: 0.05, draw: drawMarble },
  { name: '흑백 체크 대리석', swatch: '#2a2a2e', size: 2.4, rough: 0.15, metal: 0.05, draw: drawChecker }
];

const floorTex = new THREE.CanvasTexture(fc);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.encoding = THREE.sRGBEncoding;
floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();   // 멀리 있는 바닥 무늬도 선명하게

function setFloor(i) {                           // 바닥 재질 바꾸기: 텍스처를 다시 그리고 광택·무늬 크기 적용

/* ---------- 천장: 6가지 종류 (이미지 선택 → '천장' 탭에서 고름) ----------
 * 기본은 고풍스러운 격자 천장: 월넛 보(들보) + 아이보리 석고 패널(금빛 테두리·에메랄드 모서리) + 가운데 장미 장식 + 황동 샹들리에.
 * 벽의 에메랄드·월넛·금빛과 어울리게 만들었고, 모두 캔버스/도형으로 즉석 생성합니다.
 * 중앙 시점에서는 보이고, 3D 버튼으로 시점이 바뀌면 서서히 사라져요 (animate()에서 처리). */
const ceiling = new THREE.Group();                   // 천장 전체 묶음: 높이는 updateRoom → layoutCeiling이 맞춤
scene.add(ceiling);
const ceilMats = [];                                 // 투명도를 한꺼번에 바꾸기 위한 재질 목록
let ceilA = 1;                                       // 천장의 현재 투명도 (1: 보임 / 0: 사라짐)
const cMat = (opt, basic) => { const m = basic ? new THREE.MeshBasicMaterial(opt) : new THREE.MeshStandardMaterial(opt); ceilMats.push(m); return m; };
const ceilTex = cv => { const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };

function makeCofferCanvas() {                        // 패널 한 칸: 아이보리 석고 + 금빛 이중 테두리 + 에메랄드 모서리 장식
  const S = 256, c = document.createElement('canvas');  c.width = c.height = S;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 20, S / 2, S / 2, S * 0.78);
  gr.addColorStop(0, '#f3ead4');  gr.addColorStop(1, '#d9ccab');
  g.fillStyle = gr;  g.fillRect(0, 0, S, S);
  g.fillStyle = 'rgba(40,25,10,.20)';   g.fillRect(0, 0, S, 10);  g.fillRect(0, 0, 10, S);          // 오목하게 들어간 느낌의 그늘
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(0, S - 6, S, 6);  g.fillRect(S - 6, 0, 6, S);
  g.strokeStyle = '#b8892f';  g.lineWidth = 4;  g.strokeRect(24, 24, S - 48, S - 48);              // 금빛 이중 테두리
  g.strokeStyle = '#d9bb6e';  g.lineWidth = 2;  g.strokeRect(33, 33, S - 66, S - 66);
  [[33, 33], [S - 33, 33], [33, S - 33], [S - 33, S - 33]].forEach(([x, y]) => {                   // 모서리 에메랄드 마름모
    g.fillStyle = '#2f4d40';  g.strokeStyle = '#b8892f';  g.lineWidth = 2;
    g.beginPath();  g.moveTo(x, y - 13);  g.lineTo(x + 13, y);  g.lineTo(x, y + 13);  g.lineTo(x - 13, y);  g.closePath();  g.fill();  g.stroke();
  });
  g.translate(S / 2, S / 2);                                                                       // 가운데 작은 네잎 장식
  g.fillStyle = 'rgba(184,137,47,.55)';
  for (let k = 0; k < 4; k++) { g.rotate(Math.PI / 2);  g.beginPath();  g.ellipse(0, -22, 9, 20, 0, 0, Math.PI * 2);  g.fill(); }
  g.fillStyle = '#2f4d40';  g.beginPath();  g.arc(0, 0, 8, 0, Math.PI * 2);  g.fill();
  return c;
}
function makeRosetteCanvas() {                       // 가운데 장미 장식(메달리온): 겹겹의 꽃잎 + 금빛 고리
  const S = 256, c = document.createElement('canvas');  c.width = c.height = S;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 10, S / 2, S / 2, S / 2);
  gr.addColorStop(0, '#f6eed9');  gr.addColorStop(1, '#e0d3b0');
  g.fillStyle = gr;  g.fillRect(0, 0, S, S);
  g.translate(S / 2, S / 2);
  g.strokeStyle = '#b8892f';  g.lineWidth = 6;  g.beginPath();  g.arc(0, 0, 120, 0, Math.PI * 2);  g.stroke();
  g.lineWidth = 2.5;  g.beginPath();  g.arc(0, 0, 108, 0, Math.PI * 2);  g.stroke();
  const ring = (n, r, rx, ry, fill) => {
    for (let k = 0; k < n; k++) {
      g.save();  g.rotate(k * Math.PI * 2 / n);  g.translate(0, -r);
      g.fillStyle = fill;  g.strokeStyle = '#8a6a24';  g.lineWidth = 1.5;
      g.beginPath();  g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);  g.fill();  g.stroke();
      g.restore();
    }
  };
  ring(16, 78, 14, 28, '#dcc78f');                   // 바깥 꽃잎 16장
  ring(8, 44, 13, 26, '#2f4d40');                    // 안쪽 에메랄드 꽃잎 8장
  g.fillStyle = '#c99a3a';  g.strokeStyle = '#6e4f17';  g.lineWidth = 2;
  g.beginPath();  g.arc(0, 0, 17, 0, Math.PI * 2);  g.fill();  g.stroke();
  return c;
}

  chAdd(new THREE.CylinderGeometry(0.025, 0.025, 0.14, 10), cMat({ color: 0xf3ecd8, roughness: 0.6 }), cx * 0.5, -0.96, cz * 0.5);   // 초
  chAdd(new THREE.SphereGeometry(0.032, 10, 8), cMat({ color: 0xffe2a0 }, true), cx * 0.5, -0.86, cz * 0.5);                   // 불꽃(스스로 빛남)
}

/* ----- 종류별 패널 무늬 그리기 (모두 이음새 없이 반복되도록 가장자리 처리) ----- */
function wrapBlob(g, S, x, y, r, rgb, a) {           // 가장자리에 걸치면 반대편에도 그려서 이어 붙여도 티가 안 나는 얼룩
  for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
    const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
    gr.addColorStop(0, `rgba(${rgb},${a})`);  gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr;  g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
  }
}
function drawPlaster() {                             // 흰 석고: 아주 은은한 얼룩과 잔 결
  const S = 256, c = document.createElement('canvas');  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#f3efe4';  g.fillRect(0, 0, S, S);
  for (let i = 0; i < 18; i++) wrapBlob(g, S, Math.random() * S, Math.random() * S, 40 + Math.random() * 80, Math.random() < 0.5 ? '255,255,255' : '150,130,100', 0.08);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(120,105,80,${Math.random() * 0.07})`;  g.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random(), 1 + Math.random()); }
  return c;
}
function drawWoodCeil() {                            // 원목 널판 천장: 가로 판자 8줄 + 나뭇결
  const S = 256, c = document.createElement('canvas');  c.width = c.height = S;
  const g = c.getContext('2d'), n = 8, ph = S / n;
  for (let r = 0; r < n; r++) {
    g.fillStyle = `hsl(${26 + Math.random() * 6}, ${38 + Math.random() * 8}%, ${27 + Math.random() * 7}%)`;  g.fillRect(0, r * ph, S, ph);
    for (let k = 0; k < 7; k++) {
      const y = r * ph + Math.random() * ph;
      g.strokeStyle = `rgba(25,12,4,${0.08 + Math.random() * 0.12})`;  g.lineWidth = 0.8 + Math.random() * 1.6;
      g.beginPath();  g.moveTo(0, y);  g.bezierCurveTo(S * 0.3, y + (Math.random() - 0.5) * 5, S * 0.7, y + (Math.random() - 0.5) * 5, S, y);  g.stroke();
    }
    g.fillStyle = 'rgba(10,5,2,.65)';  g.fillRect(0, r * ph + ph - 2, S, 2);   // 판자 사이 틈
  }
  return c;
}
function drawStars() {                               // 별빛 남색: 깊은 밤하늘 + 은은한 성운 + 별
  const S = 512, c = document.createElement('canvas');  c.width = c.height = S;

  const S = 256, c = document.createElement('canvas');  c.width = c.height = S;

    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {      // 가장자리에 걸친 무늬는 반대편에도 그려 이어 붙이기

/* ---------- 액자 크기 자동 조절 (이미지 비율 유지) ----------
 * 이미지 가로/세로 비율(aspect)에 맞춰 그림 → 여백 → 프레임 순으로 크기를 다시 계산합니다. */
function fitFrame(w, aspect) {
  w.aspect = aspect;                                 // 벽 크기가 바뀌면 다시 맞추기 위해 비율 저장
  if (w.item) return;                                // 2D오브젝트는 만들 때 이미 크기에 맞춰 만들어져 있음
  let iw, ih;
  if (w.fw) { iw = w.fw; ih = w.fh; }                // 오브젝트 액자: 입력한 크기 그대로
  else {                                             // (옛 방식) 벽 크기에 비례해 최대 크기를 제한하고 그림 비율에 맞춤
    const wd = dims[w.i];
    const maxW = Math.min(MAX_W, wd.w * 0.7), maxH = Math.min(MAX_H, wd.h * 0.6);
    iw = maxW;  ih = iw / aspect;
    if (ih > maxH) { ih = maxH; iw = ih * aspect; }
  }
  const sc = Math.min(1, iw / 2);                    // 작은 벽에서는 액자 테두리/두께도 같이 작아지게
  const m = 0.12 * sc, t = 0.14 * sc, d = 0.12 * sc; // 여백 폭 / 프레임 굵기 / 프레임 두께
  w.mat.position.z = 0.03 * sc;  w.art.position.z = 0.04 * sc;
  const mw = iw + 2 * m, mh = ih + 2 * m;            // 여백(매트)까지 포함한 크기
  w.art.scale.set(iw, ih, 1);
  w.mat.scale.set(mw, mh, 1);
  const [top, bottom, left, right] = w.bars;
  top.scale.set(mw + 2 * t, t, d);     top.position.set(0,  (mh + t) / 2, d / 2);
  bottom.scale.set(mw + 2 * t, t, d);  bottom.position.set(0, -(mh + t) / 2, d / 2);
  left.scale.set(t, mh, d);            left.position.set(-(mw + t) / 2, 0, d / 2);
  right.scale.set(t, mh, d);           right.position.set((mw + t) / 2, 0, d / 2);
}

/* ---------- 오브젝트1: 액자 (생성 · 끌어서 이동 · 그림 교체 · 삭제) ----------
 * 액자는 '걸려 있는 벽 그룹'의 자식이라서 벽 기준 좌표(x: 가로 위치, y: 높이)로 위치를 저장합니다. */
function coverTexture(tex, A) {                      // 그림을 액자 비율(A=가로/세로)에 '꽉 채우기': 늘어나지 않고 넘치는 부분만 잘림
  const I = tex.image.width / tex.image.height;
  if (I > A) { tex.repeat.set(A / I, 1); tex.offset.set((1 - A / I) / 2, 0); }
  else       { tex.repeat.set(1, I / A); tex.offset.set(0, (1 - I / A) / 2); }
}
function loadFrameImage(f, url) {                    // 액자 안 그림 적용 (기본 이미지 & 업로드 공용)
  f.src = url;                                       // 세이브할 때 쓰기 위해 출처 기억
  loader.load(url, tex => {
    if (f.removed) { tex.dispose(); return; }
    tex.encoding = THREE.sRGBEncoding;  tex.anisotropy = maxAniso;
    coverTexture(tex, f.fw / f.fh);
    if (f.artMat.map) f.artMat.map.dispose();
    f.artMat.map = tex;  f.artMat.needsUpdate = true;
    if (url.startsWith('blob:')) { if (f.blob) URL.revokeObjectURL(f.blob); f.blob = url; }
  }, undefined, () => {
    if (f.removed) return;
    const ph = placeholderTexture('이미지를 불러올 수 없어요');  coverTexture(ph, f.fw / f.fh);
    f.artMat.map = ph;  f.artMat.needsUpdate = true;
  });
}

function placeFrame(f, wi, u, v) {                   // 액자를 wi번 벽의 (u, v)에 놓기. 벽 밖으로는 못 나가게 제한
  const w = walls[wi], d = dims[wi];
  if (f.group.parent !== w.group) { w.group.add(f.group); f.i = wi; fitFrame(f, f.aspect); wallTreeVer++; }   // 다른 벽으로 옮겨지면 부모 교체
  const hw = f.item ? f.fw / 2 : f.bars[0].scale.x / 2, hh = f.item ? f.fh / 2 : f.bars[2].scale.y / 2 + f.bars[0].scale.y;           // 액자 바깥 절반 크기
  const ux = Math.max(0, d.w / 2 - hw);
  const lo = f.kind === 'door' ? f.fh / 2 : Math.min(hh, d.h / 2), hi = f.kind === 'door' ? f.fh / 2 : Math.max(d.h - hh, d.h / 2);   // 문은 바닥에 붙어 높이 고정
  f.group.position.set(clamp(u, -ux, ux), clamp(v, lo, hi), 0.004);
}

let forceWall = null;                                // 세이브 파일을 불러오는 동안만 쓰는 '이 벽에 만들어라' 지정
function facingWall() {                              // 지금 시점에서 정면으로 보이는 벽 번호
  if (forceWall !== null) return forceWall;
  if (mode === 'wall') return wallView;
  if (mode === 'top') return (topSide + 2) % 4;      // 3D: 투명해진 벽의 맞은편
  const dirX = -Math.sin(yaw), dirZ = -Math.cos(yaw);   // 지금 바라보는 방향 (전역 fx(바닥 캔버스)와 이름이 겹치지 않게 변경)
  let best = 0, bd = 9;
  walls.forEach((w, i) => {
    const d = dirX * Math.sin(w.group.rotation.y) + dirZ * Math.cos(w.group.rotation.y);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

function selectFrame(f) {                            // 선택한 액자는 프레임이 밝게 빛나고, 우측 패널이 열림
  if (selFrame) selFrame.woodMat.emissive.setHex(0x000000);
  selFrame = f || null;
  if (selFrame) selFrame.woodMat.emissive.setHex(0x5a4020);
  if (f && selProp) selectProp(null);
  updatePanel();
  frames.forEach(o => { if (o.entry) o.entry.classList.toggle('sel', o === selFrame); });   // 이미지 선택 목록에서도 표시
}

function createFrame(wCm, hCm, name, src) {                     // 오브젝트1 '액자' 만들기: 입력한 크기로, 지금 보는 벽에 생성
  const wi = facingWall(), d = dims[wi], k = frames.length;
  const w = Math.min(clamp(wCm, 5, 1000) / 100, d.w * 0.9), h = Math.min(clamp(hCm, 5, 400) / 100, d.h * 0.9);   // 벽보다 크면 줄임
  const ph = placeholderTexture('불러오는 중...');  coverTexture(ph, w / h);
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.45 });
  const matMat  = new THREE.MeshStandardMaterial({ color: 0xfbfaf6, roughness: 1 });
  const artMat  = new THREE.MeshStandardMaterial({ map: ph, roughness: 0.75 });
  const plane = new THREE.PlaneGeometry(1, 1), box = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.Mesh(plane, matMat), art = new THREE.Mesh(plane, artMat);
  const bars = [0, 1, 2, 3].map(() => new THREE.Mesh(box, woodMat));
  const group = new THREE.Group();
  group.add(mat, art, ...bars);
  const f = { i: wi, group, mat, art, bars, artMat, woodMat, aspect: w / h, fw: w, fh: h, no: ++frameSeq };
  f.name = (name || '').trim().slice(0, 20) || `액자 ${f.no}`;       // 입력한 이름 (비우면 '액자 N')
  f.title = `${f.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
  group.userData.frame = f;
  const n = frames.filter(o => o.i === wi).length;   // 같은 벽에 여러 개면 겹치지 않게 조금씩 옆으로
  frames.push(f);
  placeFrame(f, wi, ((n % 5) - 2) * 0.5, Math.min(FRAME_Y, d.h * 0.55));
  // 이미지 선택 패널의 '액자이미지' 목록에 이 액자 전용 버튼 추가
  const up = makeUpload('', '기본 이미지', url => loadFrameImage(f, url));
  up.label.querySelector('b').textContent = f.title;   // 이름은 textContent로 넣어 안전하게 표시
  f.entry = up.label;
  f.entry.addEventListener('click', () => selectFrame(f));
  $('frameList').appendChild(f.entry);
  refreshFrameTab();
  loadFrameImage(f, src || artworkImages[1 + k % 3]);   // 기본 그림 (세이브 파일에서 불러올 때는 저장된 그림) (위쪽 artworkImages 목록을 돌려 씀)
  selectFrame(f);
}

function doorTexture() {                            // 문짝 무늬: 세로 나뭇결 + 위·아래 장식 패널 (캔버스로 그림)
  const c = document.createElement('canvas');  c.width = 256;  c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#6b4a2f';  g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 256;
    g.strokeStyle = `rgba(30,15,5,${0.06 + Math.random() * 0.1})`;  g.lineWidth = 1 + Math.random() * 2;
    g.beginPath();  g.moveTo(x, 0);  g.lineTo(x + (Math.random() - 0.5) * 14, 512);  g.stroke();
  }
  [[40, 40, 176, 190], [40, 282, 176, 190]].forEach(([x, y, w, h]) => {
    g.fillStyle = '#7d5a3b';  g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(20,10,0,.55)';  g.lineWidth = 4;  g.strokeRect(x, y, w, h);
    g.strokeStyle = 'rgba(255,230,190,.25)';  g.lineWidth = 2;  g.strokeRect(x + 5, y + 5, w - 10, h - 10);
  });
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
}

function createDoor(wCm, hCm, name) {                // 오브젝트6 '문': 바닥에 붙어 있고, 끌면 벽을 따라(다른 벽으로도) 움직임
  const wi = facingWall(), d = dims[wi];
  const w = Math.min(clamp(wCm, 30, 600) / 100, d.w * 0.9), h = Math.min(clamp(hCm, 50, 400) / 100, d.h * 0.98);   // 벽보다 크면 줄임
  const woodMat = new THREE.MeshStandardMaterial({ color: 0xf3f0e8, roughness: 0.8 });                    // 문틀 (흰색)
  const matMat  = new THREE.MeshStandardMaterial({ color: 0x1d140d, roughness: 1 });                      // 문짝과 문틀 사이 그늘진 틈
  const artMat  = new THREE.MeshStandardMaterial({ map: doorTexture(), roughness: 0.6 });                 // 문짝
  const knobMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.8 });    // 황동 손잡이
  const plane = new THREE.PlaneGeometry(1, 1), box = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.Mesh(plane, matMat), art = new THREE.Mesh(plane, artMat);
  const bars = [0, 1, 2, 3].map(() => new THREE.Mesh(box, woodMat));
  bars[1].visible = false;                           // 아래쪽 문틀(문턱)은 없음
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), knobMat);
  const group = new THREE.Group();
  group.add(mat, art, ...bars, knob);
  const f = { i: wi, kind: 'door', group, mat, art, bars, artMat, woodMat, aspect: w / h, fw: w, fh: h };
  const no = ++doorSeq;
  f.name = (name || '').trim().slice(0, 20) || `문 ${no}`;            // 이름을 비우면 '문 1' 처럼
  f.title = `${f.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
  group.userData.frame = f;                          // 액자와 같은 방식으로 선택·끌기·삭제됨
  const n = frames.filter(o => o.i === wi).length;
  frames.push(f);
  placeFrame(f, wi, ((n % 5) - 2) * 0.5, h / 2);
  f.knob = knob;  layoutKnob(f);
  selectFrame(f);
}

function layoutKnob(f) {                             // 문 손잡이 위치·크기: 문 오른쪽, 바닥에서 약 1m (작은 문에선 같이 작아짐)
  const w = f.fw, h = f.fh, s = Math.min(1, w);
  f.knob.scale.setScalar(s);
  f.knob.position.set(w / 2 - 0.1 * s, Math.min(1, h * 0.45) - h / 2, 0.04 * Math.min(1, w / 2) + 0.04);
}

function editFrame(f, name, wCm, hCm) {              // 액자·문의 이름과 크기 수정
  if (f.item) {                                      // 2D오브젝트: 이름·크기를 바꾸고 모양을 다시 만듦
    f.name = (name || '').trim().slice(0, 20) || f.name;
    setItemSize(f, wCm, hCm);
    placeFrame(f, f.i, f.group.position.x, f.group.position.y);
    if (selFrame === f) f.woodMat.emissive.setHex(0x5a4020);   // 새로 만든 도형에도 선택 표시
    updatePanel();
    return;
  }
  const door = f.kind === 'door', d = dims[f.i];
  const w = Math.min(clamp(wCm, door ? 30 : 5, door ? 600 : 1000) / 100, d.w * 0.9);
  const h = Math.min(clamp(hCm, door ? 50 : 5, 400) / 100, d.h * (door ? 0.98 : 0.9));       // 벽보다 크면 줄임
  f.fw = w;  f.fh = h;  f.aspect = w / h;
  fitFrame(f, f.aspect);                             // 새 크기로 그림·여백·프레임 다시 계산
  if (door) layoutKnob(f);
  else if (f.artMat.map) coverTexture(f.artMat.map, w / h);   // 그림을 새 비율에 맞춰 다시 꽉 채움
  placeFrame(f, f.i, f.group.position.x, door ? h / 2 : f.group.position.y);   // 벽 안으로 다시 맞춤
  f.name = (name || '').trim().slice(0, 20) || f.name;          // 이름을 비우면 기존 이름 유지
  f.title = `${f.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
  if (f.entry) f.entry.querySelector('b').textContent = f.title;   // 이미지 선택 목록의 이름도 갱신
  updatePanel();
}

function editProp(p, name, wCm, hCm) {               // 바닥 소품의 이름과 크기 수정: 모양을 새 크기로 다시 만듦
  const w = clamp(wCm, 10, 600) / 100, h = clamp(hCm, 10, 400) / 100;
  buildProp(p, w, h);
  p.name = (name || '').trim().slice(0, 20) || p.name;
  p.title = `${p.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
  placeProp(p, p.group.position.x, p.group.position.z);          // 크기가 바뀌었으니 방 안으로 다시 맞춤
  glow(p.group, 0x4a3818);                           // 새로 만든 도형에도 선택 표시
  updatePanel();
}

function removeFrame(f) {
  f.removed = true;
  if (f.group.parent) f.group.parent.remove(f.group);
  wallTreeVer++;
  f.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  if (f.blob) URL.revokeObjectURL(f.blob);
  frames.splice(frames.indexOf(f), 1);
  if (f.entry) f.entry.remove();                     // 이미지 선택 목록에서도 삭제
  refreshFrameTab();
  if (selFrame === f) selectFrame(null);
}

/* ---------- 오브젝트2~5, 7~14: 바닥에 놓는 전시관 소품 (벤치 · 조각상 · 진열장 · 화분 · 기둥 · 로프 · 좌대 · 흉상 · 이젤 · 의자 · 설명대 · 데스크) ----------
 * 도형(상자·원기둥 등)을 조합해 만들고, 바닥 위(x, z)에서 끌어 옮기거나 90° 돌릴 수 있습니다. */
function paintingTexture() {                         // 이젤 위 캔버스에 걸 추상화를 즉석에서 그림 (제네레이티브)
  const c = document.createElement('canvas');  c.width = 320;  c.height = 240;
  const g = c.getContext('2d'), hue = Math.random() * 360;
  g.fillStyle = `hsl(${hue}, 25%, 92%)`;  g.fillRect(0, 0, 320, 240);
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * 320, y = Math.random() * 240, r = 20 + Math.random() * 70, h2 = (hue + Math.random() * 160) % 360;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `hsla(${h2}, 70%, 55%, 0.85)`);  gr.addColorStop(1, `hsla(${h2}, 70%, 55%, 0)`);
    g.fillStyle = gr;  g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    g.strokeStyle = `hsla(${(hue + 180) % 360}, 60%, 25%, 0.7)`;
    g.beginPath();  g.moveTo(Math.random() * 320, Math.random() * 240);
    g.bezierCurveTo(Math.random() * 320, Math.random() * 240, Math.random() * 320, Math.random() * 240, Math.random() * 320, Math.random() * 240);  g.stroke();
  }
  const t = new THREE.CanvasTexture(c);  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
}
function plaqueTexture() {                           // 작품 설명판: 제목 + 설명 줄무늬
  const c = document.createElement('canvas');  c.width = 256;  c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f1e8';  g.fillRect(0, 0, 256, 180);
  g.fillStyle = '#222';  g.fillRect(18, 20, 130, 14);
  g.fillStyle = '#777';  g.fillRect(18, 42, 80, 7);
  g.fillStyle = '#aaa';
  for (let i = 0; i < 6; i++) g.fillRect(18, 70 + i * 16, 220 - (i % 3) * 30, 6);
  const t = new THREE.CanvasTexture(c);  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
}

function clockTexture() {                            // 괘종시계 문자판
  const c = document.createElement('canvas');  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f6f0dc';  g.beginPath();  g.arc(64, 64, 62, 0, Math.PI * 2);  g.fill();
  g.strokeStyle = '#6e4f17';  g.lineWidth = 4;  g.stroke();
  g.strokeStyle = '#222';  g.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    g.beginPath();  g.moveTo(64 + Math.sin(a) * 50, 64 - Math.cos(a) * 50);  g.lineTo(64 + Math.sin(a) * 58, 64 - Math.cos(a) * 58);  g.stroke();
  }
  g.lineWidth = 5;  g.beginPath();  g.moveTo(64, 64);  g.lineTo(64 - 22, 64 - 24);  g.stroke();    // 시침
  g.lineWidth = 3;  g.beginPath();  g.moveTo(64, 64);  g.lineTo(64 + 34, 64 - 28);  g.stroke();    // 분침
  const t = new THREE.CanvasTexture(c);  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
}
function signTexture() {                             // 안내 입간판: 칠판 느낌의 판 + 화살표와 글줄
  const c = document.createElement('canvas');  c.width = 200;  c.height = 300;
  const g = c.getContext('2d');
  g.fillStyle = '#1f3a2e';  g.fillRect(0, 0, 200, 300);
  g.strokeStyle = '#e9e5d6';  g.lineWidth = 4;  g.strokeRect(10, 10, 180, 280);
  g.fillStyle = '#e9e5d6';  g.fillRect(30, 36, 110, 14);
  g.beginPath();  g.moveTo(30, 120);  g.lineTo(110, 120);  g.lineTo(110, 98);  g.lineTo(160, 130);  g.lineTo(110, 162);  g.lineTo(110, 140);  g.lineTo(30, 140);  g.closePath();  g.fill();   // 화살표
  g.fillStyle = 'rgba(233,229,214,.65)';
  for (let i = 0; i < 4; i++) g.fillRect(30, 195 + i * 18, 140 - (i % 2) * 40, 7);
  const t = new THREE.CanvasTexture(c);  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
}

function buildProp(p, w, h) {                        // 소품 모양 만들기: 처음 만들 때와 크기를 수정할 때 모두 사용 (w, h는 m)
  const g = p.group, kind = p.kind;
  while (g.children.length) {                        // 이전 모양이 있으면 정리
    const o = g.children[0];  g.remove(o);
    o.traverse(d => { if (d.geometry) d.geometry.dispose(); if (d.material) { if (d.material.map) d.material.map.dispose(); d.material.dispose(); } });
  }
  const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6 }, o));
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  let hx = w / 2, hz = w / 2;                        // 바닥에서 차지하는 절반 크기 (방 밖으로 못 나가게 제한)
  if (kind === 'bench') {                            // w: 길이, h: 깊이
    const seatH = 0.45;
    add(new THREE.BoxGeometry(w, 0.06, h), M(0x8a5a35), 0, seatH, 0);                                  // 의자판
    [-1, 1].forEach(k => add(new THREE.BoxGeometry(0.06, seatH, h * 0.85), M(0x2b2b2e, { metalness: 0.3 }), k * (w / 2 - 0.12), seatH / 2, 0));   // 다리
    hz = h / 2;
  } else if (kind === 'statue') {                    // w: 받침대 폭, h: 전체 높이
    const ph = h * 0.55, r = Math.min(w * 0.45, (h - ph) * 0.4);
    add(new THREE.BoxGeometry(w, ph, w), M(0xf2f0ea, { roughness: 0.9 }), 0, ph / 2, 0);              // 받침대
    add(new THREE.TorusKnotGeometry(r, r * 0.3, 96, 12), M(0xb8892f, { metalness: 0.7, roughness: 0.3 }), 0, ph + (h - ph) / 2, 0);   // 조각
  } else if (kind === 'case') {                      // w: 가로(깊이도 같음), h: 전체 높이
    const bh = h * 0.4, rr = Math.min(w, h - bh) * 0.22;
    add(new THREE.BoxGeometry(w, bh, w), M(0xf2f0ea, { roughness: 0.9 }), 0, bh / 2, 0);              // 받침
    add(new THREE.BoxGeometry(w * 0.98, h - bh, w * 0.98), M(0xcfe8ff, { transparent: true, opacity: 0.25, roughness: 0.1, depthWrite: false }), 0, bh + (h - bh) / 2, 0);   // 유리
    add(new THREE.SphereGeometry(rr, 24, 16), M(0xc0392b, { roughness: 0.3 }), 0, bh + rr, 0);         // 전시품
  } else if (kind === 'column') {                    // 대리석 기둥. w: 기둥 지름, h: 전체 높이
    const bh = Math.min(0.15, h * 0.06), bw = w * 1.45, marble = M(0xece9e1, { roughness: 0.5 });
    add(new THREE.BoxGeometry(bw, bh, bw), marble, 0, bh / 2, 0);                                      // 주춧돌
    add(new THREE.CylinderGeometry(w * 0.46, w * 0.5, h - bh * 2, 32), marble, 0, h / 2, 0);            // 기둥 몸통
    add(new THREE.BoxGeometry(bw, bh, bw), marble, 0, h - bh / 2, 0);                                   // 기둥머리
    for (let i = 0; i < 16; i++) {                                                                      // 세로 홈 무늬
      const a = i / 16 * Math.PI * 2;
      add(new THREE.CylinderGeometry(w * 0.02, w * 0.02, h - bh * 2 - 0.1, 6), M(0xd6d2c6, { roughness: 0.6 }), Math.cos(a) * w * 0.47, h / 2, Math.sin(a) * w * 0.47);
    }
    hx = hz = bw / 2;
  } else if (kind === 'rope') {                      // 로프 안전선. w: 두 기둥 사이 길이, h: 기둥 높이
    const gold = M(0xc9a24a, { metalness: 0.8, roughness: 0.25 });
    [-1, 1].forEach(k => {
      add(new THREE.CylinderGeometry(0.12, 0.13, 0.03, 24), gold, k * w / 2, 0.015, 0);                 // 받침
      add(new THREE.CylinderGeometry(0.022, 0.026, h, 12), gold, k * w / 2, h / 2, 0);                  // 기둥
      add(new THREE.SphereGeometry(0.045, 16, 12), gold, k * w / 2, h, 0);                              // 꼭지
    });
    const top = h * 0.9, sag = Math.min(h * 0.25, w * 0.12), pts = [];
    for (let i = 0; i <= 16; i++) { const t = i / 16 * 2 - 1; pts.push(new THREE.Vector3(t * w / 2, top - sag * (1 - t * t), 0)); }   // 처진 로프 곡선
    add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.014, 8), M(0x8e1b2c, { roughness: 0.7 }), 0, 0, 0);
    hx = w / 2 + 0.14;  hz = 0.14;
  } else if (kind === 'vase') {                      // 도자기 좌대. w: 좌대 폭, h: 전체 높이
    const ph = h * 0.58, vh = h - ph - 0.04, rv = Math.min(w * 0.4, vh * 0.32), marble = M(0xf2f0ea, { roughness: 0.9 });
    add(new THREE.BoxGeometry(w, ph, w), marble, 0, ph / 2, 0);                                         // 좌대
    add(new THREE.BoxGeometry(w * 1.1, 0.04, w * 1.1), marble, 0, ph + 0.02, 0);                        // 좌대 윗판
    const prof = [[0.001, 0], [0.45, 0], [0.6, 0.08], [1, 0.4], [0.88, 0.72], [0.42, 0.86], [0.5, 1]].map(([x, y]) => new THREE.Vector2(x * rv, y * vh));
    add(new THREE.LatheGeometry(prof, 32), M(0x2c5f8e, { roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide }), 0, ph + 0.04, 0);   // 청자 항아리
    hx = hz = w * 0.55;
  } else if (kind === 'bust') {                      // 흉상. w: 받침대 폭, h: 전체 높이
    const ph = h * 0.55, bh = h - ph, sr = Math.min(bh * 0.3, w * 0.34), hr = Math.min(bh * 0.22, sr * 0.8);
    const bronze = M(0x8a6a3c, { metalness: 0.6, roughness: 0.35 }), nh = hr * 0.9;
    add(new THREE.BoxGeometry(w, ph, w), M(0xf2f0ea, { roughness: 0.9 }), 0, ph / 2, 0);                // 받침대
    add(new THREE.SphereGeometry(sr, 24, 16), bronze, 0, ph + sr * 0.55, 0).scale.set(1.3, 0.6, 0.8);   // 어깨
    add(new THREE.CylinderGeometry(hr * 0.45, hr * 0.55, nh, 16), bronze, 0, ph + sr + nh / 2, 0);      // 목
    add(new THREE.SphereGeometry(hr, 24, 16), bronze, 0, ph + sr + nh * 0.8 + hr * 1.2, 0).scale.set(0.9, 1.2, 1);   // 머리
    hx = hz = w * 0.5;
  } else if (kind === 'easel') {                     // 이젤과 그림. w: 캔버스 폭, h: 전체 높이
    const wood = M(0xa9783f, { roughness: 0.7 }), t = 0.04, cH = Math.min(w * 0.75, h * 0.62), ledgeY = h * 0.26;
    const foot = Math.max(w * 0.55, 0.3), backZ = -Math.max(h * 0.28, 0.3);
    const bar = (x1, y1, z1, x2, y2, z2) => {        // 두 점을 잇는 막대 (이젤 다리)
      const a = new THREE.Vector3(x1, y1, z1), b = new THREE.Vector3(x2, y2, z2), d = b.clone().sub(a), len = d.length();
      const m = new THREE.Mesh(new THREE.BoxGeometry(t, len, t), wood);
      m.position.copy(a).add(b).multiplyScalar(0.5);  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());  g.add(m);
    };
    bar(-foot, 0, -0.1, -0.05, h * 0.97, -0.03);  bar(foot, 0, -0.1, 0.05, h * 0.97, -0.03);  bar(0, 0, backZ, 0, h * 0.8, -0.05);
    add(new THREE.BoxGeometry(0.05, h, 0.03), wood, 0, h / 2, 0);                                       // 가운데 기둥
    add(new THREE.BoxGeometry(w * 1.06, 0.03, 0.1), wood, 0, ledgeY, 0.06);                             // 캔버스 받침대
    add(new THREE.BoxGeometry(w * 0.5, 0.03, 0.05), wood, 0, ledgeY + 0.015 + cH + 0.01, 0.075);        // 윗고정대
    add(new THREE.BoxGeometry(w, cH, 0.03), new THREE.MeshStandardMaterial({ map: paintingTexture(), roughness: 0.8 }), 0, ledgeY + 0.015 + cH / 2, 0.045);   // 그림
    hx = foot + 0.05;  hz = -backZ + 0.05;
  } else if (kind === 'ottoman') {                   // 원형 관람 의자. w: 지름, h: 높이
    const bh = Math.min(0.06, h * 0.2), cushion = M(0x7b1e2b, { roughness: 0.9 });
    add(new THREE.CylinderGeometry(w * 0.46, w * 0.44, bh, 32), M(0x2b2b2e, { metalness: 0.4 }), 0, bh / 2, 0);   // 받침
    add(new THREE.CylinderGeometry(w * 0.5, w * 0.5, h - bh, 32), cushion, 0, bh + (h - bh) / 2, 0);              // 쿠션
    add(new THREE.TorusGeometry(w * 0.5, Math.min(0.03, (h - bh) * 0.15), 12, 40), cushion, 0, h, 0).rotation.x = Math.PI / 2;   // 둥근 모서리
    hx = hz = w / 2;
  } else if (kind === 'plaque') {                    // 작품 설명대. w: 설명판 폭, h: 전체 높이
    const bh = Math.min(w * 0.7, h * 0.4), metal = M(0x2b2b2e, { metalness: 0.5, roughness: 0.4 }), postH = h - bh * 0.4;
    add(new THREE.CylinderGeometry(Math.max(w * 0.4, 0.15), Math.max(w * 0.4, 0.15), 0.03, 24), metal, 0, 0.015, 0);   // 받침
    add(new THREE.CylinderGeometry(0.02, 0.02, postH, 12), metal, 0, postH / 2, 0);                     // 기둥
    const pivot = new THREE.Group();  pivot.position.set(0, h - bh * 0.45, 0);  pivot.rotation.x = -0.55;  g.add(pivot);   // 뒤로 살짝 기울인 설명판
    pivot.add(new THREE.Mesh(new THREE.BoxGeometry(w, bh, 0.025), M(0x1f2430, { roughness: 0.5 })));
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, bh * 0.85), new THREE.MeshStandardMaterial({ map: plaqueTexture(), roughness: 0.8 }));
    paper.position.z = 0.0135;  pivot.add(paper);
    hx = hz = Math.max(w / 2, 0.2);
  } else if (kind === 'desk') {                      // 안내 데스크. w: 길이, h: 깊이 (높이는 1m 고정)
    const dh = 1.0;
    add(new THREE.BoxGeometry(w, dh, h), M(0xf4f2ec, { roughness: 0.8 }), 0, dh / 2, 0);                // 몸체
    add(new THREE.BoxGeometry(w + 0.06, 0.05, h + 0.06), M(0x2b2a2e, { roughness: 0.3, metalness: 0.2 }), 0, dh + 0.025, 0);   // 상판
    add(new THREE.BoxGeometry(w * 0.98, 0.04, 0.01), M(0xc9a24a, { metalness: 0.8, roughness: 0.25 }), 0, dh * 0.55, h / 2 + 0.005);   // 앞면 금장 띠
    hx = w / 2 + 0.03;  hz = h / 2 + 0.03;
  } else if (kind === 'fountain') {                  // 분수대. w: 지름, h: 전체 높이
    const stone = M(0xd9d5ca, { roughness: 0.8 }), bh = h * 0.28;
    add(new THREE.CylinderGeometry(w * 0.5, w * 0.52, bh, 40), stone, 0, bh / 2, 0);                    // 수조
    add(new THREE.TorusGeometry(w * 0.47, 0.04, 10, 48), stone, 0, bh, 0).rotation.x = Math.PI / 2;     // 테두리
    add(new THREE.CylinderGeometry(w * 0.44, w * 0.44, 0.01, 40), M(0x6fb6d9, { roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.8 }), 0, bh + 0.005, 0);   // 물
    const ph = h * 0.78 - bh;
    add(new THREE.CylinderGeometry(w * 0.05, w * 0.07, ph, 16), stone, 0, bh + ph / 2, 0);              // 가운데 기둥
    add(new THREE.CylinderGeometry(w * 0.22, w * 0.06, 0.08, 24), stone, 0, h * 0.78 + 0.04, 0);        // 윗 물받이
    add(new THREE.CylinderGeometry(0.012, 0.02, h * 0.18, 8), M(0xbfe6ff, { transparent: true, opacity: 0.6, roughness: 0.1 }), 0, h * 0.82 + h * 0.09, 0);   // 물줄기
    hx = hz = w * 0.53;
  } else if (kind === 'lamp') {                      // 스탠드 조명. w: 갓 지름, h: 전체 높이
    const metal = M(0x2b2b2e, { metalness: 0.5, roughness: 0.4 });
    add(new THREE.CylinderGeometry(w * 0.35, w * 0.38, 0.03, 24), metal, 0, 0.015, 0);                  // 받침
    add(new THREE.CylinderGeometry(0.015, 0.015, h * 0.95, 8), metal, 0, h * 0.475, 0);                 // 기둥
    add(new THREE.CylinderGeometry(w * 0.3, w * 0.5, h * 0.18, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff1c9, side: THREE.DoubleSide }), 0, h - h * 0.09, 0);   // 불 켜진 갓
    add(new THREE.SphereGeometry(w * 0.1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, h - h * 0.12, 0);   // 전구
    hx = hz = w * 0.5;
  } else if (kind === 'sofa') {                      // 소파. w: 길이, h: 깊이 (등받이 높이 약 0.7m)
    const fab = M(0x3b4a5a, { roughness: 0.95 }), fab2 = M(0x33414f, { roughness: 0.95 });
    add(new THREE.BoxGeometry(w - 0.3, 0.28, h), fab2, 0, 0.14, 0);                                      // 몸체
    add(new THREE.BoxGeometry(w - 0.3, 0.14, h * 0.78), fab, 0, 0.35, h * 0.11);                        // 방석
    add(new THREE.BoxGeometry(w - 0.3, 0.4, h * 0.22), fab2, 0, 0.48, -h * 0.39);                       // 등받이
    [-1, 1].forEach(k => add(new THREE.BoxGeometry(0.15, 0.55, h), fab2, k * (w / 2 - 0.075), 0.275, 0));   // 팔걸이
    hx = w / 2;  hz = h / 2;
  } else if (kind === 'clock') {                     // 괘종시계. w: 폭, h: 높이
    const wood = M(0x5a3a22, { roughness: 0.5 }), d = w * 0.6, gold = M(0xc9a24a, { metalness: 0.8, roughness: 0.3 });
    add(new THREE.BoxGeometry(w * 1.1, h * 0.08, d * 1.05), wood, 0, h * 0.04, 0);                      // 받침
    add(new THREE.BoxGeometry(w * 0.8, h * 0.6, d * 0.85), wood, 0, h * 0.38, 0);                       // 몸통
    add(new THREE.BoxGeometry(w, h * 0.24, d), wood, 0, h * 0.8, 0);                                    // 시계 머리
    add(new THREE.BoxGeometry(w * 1.1, h * 0.04, d * 1.05), wood, 0, h * 0.94, 0);                      // 윗덮개
    add(new THREE.CircleGeometry(w * 0.36, 32), new THREE.MeshStandardMaterial({ map: clockTexture(), roughness: 0.5 }), 0, h * 0.8, d / 2 + 0.002);   // 문자판
    add(new THREE.PlaneGeometry(w * 0.4, h * 0.35), M(0x201510, { roughness: 0.4 }), 0, h * 0.38, d * 0.425 + 0.002);   // 추 창
    add(new THREE.CylinderGeometry(w * 0.12, w * 0.12, 0.012, 24), gold, 0, h * 0.28, d * 0.425 + 0.01).rotation.x = Math.PI / 2;   // 금빛 추
    add(new THREE.BoxGeometry(0.01, h * 0.2, 0.005), gold, 0, h * 0.42, d * 0.425 + 0.006);              // 추 막대
    hx = w * 0.55;  hz = d * 0.55;
  } else if (kind === 'partition') {                 // 전시 파티션(이동식 벽). w: 폭, h: 높이
    add(new THREE.BoxGeometry(w, h - 0.05, 0.05), M(0xf6f5f1, { roughness: 0.95 }), 0, 0.05 + (h - 0.05) / 2, 0);   // 판
    [-1, 1].forEach(k => add(new THREE.BoxGeometry(0.06, 0.05, 0.5), M(0x2b2b2e, { metalness: 0.4 }), k * Math.max(0, w / 2 - 0.15), 0.025, 0));   // 받침발
    hx = w / 2;  hz = 0.27;
  } else if (kind === 'platform') {                  // 계단형 전시 단상. w: 아래단 폭, h: 전체 높이
    const s = h / 3;
    [0xe9e5da, 0xdedad0, 0xd2cec3].forEach((c, i) => {
      const sz = w * (1 - 0.25 * i);
      add(new THREE.BoxGeometry(sz, s, sz), M(c, { roughness: 0.9 }), 0, s * (i + 0.5), 0);
    });
    hx = hz = w / 2;
  } else if (kind === 'sign') {                      // 안내 입간판(A자형). w: 폭, h: 높이
    const tilt = 0.2, bz = h * Math.sin(tilt), frame = M(0x3a2a1c, { roughness: 0.6 });
    [[1, bz], [-1, -bz]].forEach(([k, z]) => {
      const pivot = new THREE.Group();  pivot.position.set(0, 0, z);  pivot.rotation.x = -k * tilt;  g.add(pivot);
      const board = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), frame);  board.position.y = h / 2;  pivot.add(board);
      if (k === 1) {                                 // 앞면에만 안내 그림
        const face = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, h * 0.9), new THREE.MeshStandardMaterial({ map: signTexture(), roughness: 0.8 }));
        face.position.set(0, h / 2, 0.0165);  pivot.add(face);
      }
    });
    hx = w / 2;  hz = bz + 0.05;
  } else if (kind === 'kiosk') {                     // 디지털 안내기. w: 화면 폭, h: 전체 높이
    const sh = Math.min(w * 0.6, h * 0.4), metal = M(0x2b2b2e, { metalness: 0.5, roughness: 0.4 });
    add(new THREE.BoxGeometry(Math.max(w * 0.5, 0.3), 0.04, 0.4), metal, 0, 0.02, 0);                   // 받침
    add(new THREE.BoxGeometry(0.08, h - sh / 2, 0.08), metal, 0, (h - sh / 2) / 2, 0);                  // 기둥
    const pivot = new THREE.Group();  pivot.position.set(0, h - sh / 2, 0);  pivot.rotation.x = -0.2;  g.add(pivot);   // 뒤로 살짝 기운 화면
    pivot.add(new THREE.Mesh(new THREE.BoxGeometry(w, sh, 0.06), metal));
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.94, sh * 0.9), new THREE.MeshBasicMaterial({ map: paintingTexture() }));   // 화면(스스로 빛남)
    scr.position.z = 0.031;  pivot.add(scr);
    hx = Math.max(w / 2, 0.2);  hz = 0.25;
  } else if (kind === 'cubes') {                     // 추상 큐브 조각. w: 아래 큐브 한 변, h: 전체 높이
    const hs = [h * 0.4, h * 0.33, h * 0.27], ws = [w, w * 0.75, w * 0.5], cols = [M(0x222226, { metalness: 0.5, roughness: 0.3 }), M(0xb8892f, { metalness: 0.7, roughness: 0.3 }), M(0xc0392b, { roughness: 0.4 })];
    let y = 0;
    hs.forEach((hh, i) => { add(new THREE.BoxGeometry(ws[i], hh, ws[i]), cols[i], 0, y + hh / 2, 0).rotation.y = i * 0.5;  y += hh; });   // 조금씩 비틀어 쌓음
    hx = hz = w * 0.72;
  } else if (kind === 'piano') {                     // 그랜드 피아노(+의자). w: 길이, h: 깊이 (앞쪽 +z에 건반)
    const black = M(0x0c0c0e, { roughness: 0.15, metalness: 0.3 });
    [[-1, 1], [1, 1], [0, -1]].forEach(([kx, kz]) => add(new THREE.CylinderGeometry(0.04, 0.03, 0.72, 12), black, kx * (w / 2 - 0.12), 0.36, kz * (h / 2 - 0.12)));   // 다리
    add(new THREE.BoxGeometry(w, 0.24, h), black, 0, 0.84, 0);                                          // 몸통
    add(new THREE.BoxGeometry(w * 0.98, 0.03, h * 0.98), black, 0, 0.975, 0);                           // 뚜껑

    for (let i = 0; i < N - 1; i++) if ([0, 1, 3, 4, 5].includes(i % 7)) add(new THREE.BoxGeometry(0.025, 0.02, 0.14), black, -kw / 2 + (i + 1) * 0.05, 0.785, kz0 - 0.045);   // 검은 건반
    const stool = M(0x6b1d28, { roughness: 0.9 });
    add(new THREE.BoxGeometry(0.5, 0.06, 0.3), stool, 0, 0.5, h / 2 + 0.6);                             // 의자
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => add(new THREE.CylinderGeometry(0.015, 0.015, 0.47, 8), black, a * 0.2, 0.235, h / 2 + 0.6 + b * 0.1));   // 의자 다리
    hx = w / 2 + 0.05;  hz = h / 2 + 0.8;
  } else if (kind === 'plant') {                     // 'plant' w: 화분 지름, h: 전체 높이
    const ph = h * 0.25, fr = Math.min(w * 0.7, (h - ph) * 0.35);
    add(new THREE.CylinderGeometry(w * 0.5, w * 0.38, ph, 24), M(0x8b5e3c), 0, ph / 2, 0);            // 화분
    add(new THREE.CylinderGeometry(w * 0.04, w * 0.05, h - ph - fr, 8), M(0x5a3b22), 0, ph + (h - ph - fr) / 2, 0);   // 줄기
    [[0, 0, 0, 1], [0.7, -0.5, 0.2, 0.7], [-0.6, -0.6, -0.3, 0.75]].forEach(([dx, dy, dz, k]) =>   // 잎 덩어리 3개
      add(new THREE.IcosahedronGeometry(fr * k, 1), M(0x2f7d46, { roughness: 0.85, flatShading: true }), dx * fr, h - fr + dy * fr * 0.5, dz * fr));
    hx = hz = Math.max(w / 2, fr);
  }
  p.hx = hx;  p.hz = hz;  p.w = w;  p.h = h;
}

function createProp(kind, label, wCm, hCm, name) {
  const w = clamp(wCm, 10, 600) / 100, h = clamp(hCm, 10, 400) / 100;     // 입력(cm) → m
  const p = { group: new THREE.Group(), kind, label };
  const g = p.group;
  buildProp(p, w, h);
  propNo[kind] = (propNo[kind] || 0) + 1;
  p.name = (name || '').trim().slice(0, 20) || `${label} ${propNo[kind]}`;       // 이름을 비우면 '벤치 1' 처럼
  p.title = `${p.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
  g.userData.prop = p;
  const n = props.length;                            // 중앙 시점이면 앞쪽 2.5m, 그 외엔 방 가운데 근처에 생성
  props.push(p);  scene.add(g);
  placeProp(p, mode === 'center' ? walk.x - Math.sin(yaw) * 2.5 : ((n % 5) - 2) * 0.8, mode === 'center' ? walk.z - Math.cos(yaw) * 2.5 : 0);
  selectProp(p);
}

function propHalf(p) {                               // 소품이 어떤 각도로 돌아가 있어도 바닥에서 차지하는 절반 크기
  const c = Math.abs(Math.cos(p.group.rotation.y)), s = Math.abs(Math.sin(p.group.rotation.y));
  return [c * p.hx + s * p.hz, s * p.hx + c * p.hz];
}
function placeProp(p, x, z) {                        // 바닥 위 (x, z)에 놓기. 방 밖으로는 못 나가게 제한
  const [hx, hz] = propHalf(p);                      // 돌린 각도에 맞는 가로·세로 절반 크기
  const lx = Math.max(0, roomW / 2 - hx - 0.05), lz = Math.max(0, roomD / 2 - hz - 0.05);
  p.group.position.set(clamp(x, -lx, lx), 0, clamp(z, -lz, lz));
}

function glow(g, hex) { g.traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setHex(hex); }); }

function selectProp(p) {
  if (selProp) glow(selProp.group, 0x000000);
  selProp = p || null;
  if (selProp) { glow(selProp.group, 0x4a3818); if (selFrame) selectFrame(null); }   // 액자와 소품은 동시에 선택되지 않음
  updatePanel();
}

function updatePanel() {                             // 우측 '선택한 오브젝트' 패널 (액자 / 바닥 소품 공용)
  const o = selFrame || selProp;
  if (editing && editing !== o) closeObj();          // 다른 오브젝트를 고르면 수정창 닫기
  $('framePanel').hidden = !o;
  $('frameName').textContent = o ? o.title : '';
}

function removeProp(p) {
  p.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  scene.remove(p.group);
  props.splice(props.indexOf(p), 1);
  if (selProp === p) selectProp(null);
}

/* ---------- 방 갱신: dims(벽별 크기) → 3D 반영 ----------
 * 방 전체 크기는 가장 긴 벽에 맞추고, 더 작은 벽은 가운데에 놓인 '전시 벽면'으로 표시됩니다.
 * (남는 부분은 짙은 바탕 벽이 채워서 방이 항상 닫혀 있어요) */
function updateRoom() {
  const W = Math.max(dims[0].w, dims[2].w);          // 방 가로(X): 북/남 벽 중 긴 쪽
  const D = Math.max(dims[1].w, dims[3].w);          // 방 깊이(Z): 동/서 벽 중 긴 쪽
  const H = Math.max(...dims.map(d => d.h));         // 천장 높이: 가장 높은 벽
  roomW = W; roomD = D; roomH = H;
  const layout = [[0, -D / 2, W], [W / 2, 0, D], [0, D / 2, W], [-W / 2, 0, D]];  // 북, 동, 남, 서: [x, z, 바탕 벽 길이]
  walls.forEach((w, i) => {
    const d = dims[i], fy = Math.min(FRAME_Y, d.h * 0.55);   // 낮은 벽이면 액자도 낮춤
    w.group.position.set(layout[i][0], 0, layout[i][1]);
    w.shell.scale.set(layout[i][2], H, 1);  w.shell.position.y = H / 2;
    w.wall.scale.set(d.w, d.h, 1);          w.wall.position.y = d.h / 2;
    w.frame.position.y = fy;
    w.spot.position.y = H - 0.2;  w.spot.target.position.set(0, fy, 0);
    fitWallpaper(w);                                 // 벽지도 벽 크기에 맞춰 다시 배치
    layoutDeco(w);                                   // 기본 벽 장식도 벽 크기에 맞춰 다시 배치
    fitFrame(w, w.aspect);                           // 벽 크기에 맞춰 액자도 다시 맞춤
  });
  frames.forEach(f => { fitFrame(f, f.aspect); placeFrame(f, f.i, f.group.position.x, f.group.position.y); });   // 액자도 벽 안에 다시 맞춤
  props.forEach(p => placeProp(p, p.group.position.x, p.group.position.z));                                      // 소품도 방 안에 다시 맞춤
  floor.scale.set(W, D, 1);
  layoutCeiling(W, D, H);                            // 천장(보·패널·장식)도 방 크기에 맞춰 다시 배치
  floorTex.repeat.set(W / floorSize, D / floorSize);   // 방이 커져도 무늬 크기는 항상 일정하게
  ceilingLight.position.set(0, H - 0.5, 0);
}
updateRoom();

/* ---------- 버튼 C: 벽별 크기 조절 UI ----------
 * 슬라이더는 '선택된 벽' 하나의 dims[i]만 바꾸므로 다른 벽에는 영향이 없습니다. */

const sliderW = $('sliderW'), sliderH = $('sliderH');   // 슬라이더

/* 상하연동: 맞은편 벽(북↔남, 동↔서)의 가로 길이를 함께 바꾸는 켜기/끄기 체크칸.
 * link[0]: 북·남 / link[1]: 동·서 (벽 번호 % 2). 지금 선택한 벽이 속한 쌍의 상태를 체크칸이 보여줍니다. */

try { const l = JSON.parse(localStorage.getItem('galleryLink')); if (Array.isArray(l)) { link[0] = !!l[0]; link[1] = !!l[1]; } } catch (e) {}

/* 슬라이더와 숫자 입력칸이 함께 쓰는 값 변경 함수
 * key: 'w'(가로) 또는 'h'(세로), min~max: 허용 범위. 선택된 벽 하나만 바뀌고 저장됩니다. */
function setDim(key, v, min, max) {
  if (!isFinite(v)) { selectWall(selWall); return; }   // 숫자가 아니면 원래 값으로 되돌림
  const val = clamp(Math.round(v), min, max) / 100;       // 입력(cm)을 정수로 보정(1~10000) 후 m로 변환해 저장
  if (key === 'h') dims.forEach(d => d.h = val);          // 세로(높이)는 동·서·남·북 모두 연동
  else {                                                  // 가로는 선택한 벽만 변경 (상하연동이 켜져 있으면 맞은편 벽도 같이)
    dims[selWall][key] = val;
    if (link[selWall % 2]) dims[(selWall + 2) % 4][key] = val;
  }
  updateRoom();  selectWall(selWall);                 // 3D 반영 + 슬라이더/숫자칸 동기화
  saveDims();
}
$('linkChk').addEventListener('change', () => {      // 상하연동 켜기/끄기: 켜는 순간 맞은편 벽을 지금 벽의 가로 길이에 맞춤
  link[selWall % 2] = $('linkChk').checked;
  saveLink();
  if (link[selWall % 2]) { dims[(selWall + 2) % 4].w = dims[selWall].w;  updateRoom();  saveDims(); }
  selectWall(selWall);
});
sliderW.addEventListener('input', () => setDim('w', +sliderW.value, 1, 10000));   // 슬라이더 드래그
sliderH.addEventListener('input', () => setDim('h', +sliderH.value, 1, 4000));
// 숫자 칸: 입력을 마치면(Enter / 다른 곳 클릭 / 화살표 클릭) 적용. 타이핑 도중에는 건드리지 않음

$('sizeBtn').addEventListener('click', () => {       // 버튼 C: 슬라이더 패널 열기/닫기

/* ---------- 버튼 D: 액자이미지 / 벽이미지 ---------- */
const NAMES = WALLS.map(w => w.name.replace(' 벽', ''));   // 북쪽·동쪽·남쪽·서쪽
const ORDER = [1, 3, 2, 0];                                // 화면에 보여줄 순서: 동·서·남·북

// 파일 선택 버튼(label + 숨긴 input) 생성. 파일을 고르면 임시 URL을 onPick에 넘겨줌
function makeUpload(title, defaultText, onPick) {
  const label = document.createElement('label');
  label.className = 'up';
  label.innerHTML = `<input type="file" accept="image/*"><b>${title}</b><span>${defaultText}</span>`;
  const input = label.querySelector('input'), span = label.querySelector('span');
  input.addEventListener('change', () => {
    const f = input.files[0];
    if (!f) return;
    onPick(URL.createObjectURL(f));                  // 새로고침 없이 즉시 교체
    span.textContent = f.name;
    input.value = '';                                // 같은 파일을 다시 골라도 반응하도록 초기화
  });
  return { label, span };
}

/* (2) 벽이미지: 벽지 텍스처 교체 (내 파일 선택) */
const wpBlobs = [], wpStatus = [];

// 벽지를 벽 비율에 맞춰 '꽉 채우기(cover)': 이미지가 늘어나지 않고 넘치는 부분만 잘림
function layoutDeco(w) {                             // 기본 벽 장식을 벽 크기에 맞춰 배치 (패널 높이는 최대 1m)
  const d = dims[w.i], k = w.deco.parts;
  const wh = Math.min(1.0, d.h * 0.28), bb = Math.min(0.12, wh * 0.18), rl = Math.min(0.06, wh * 0.1), ch = Math.min(0.18, d.h * 0.06);
  k.wains.scale.set(d.w, wh, 1);              k.wains.position.set(0, wh / 2, 0.003);
  w.deco.wainTex.repeat.set(Math.max(0.05, d.w / 0.8), 1);          // 패널 한 칸 약 80cm
  k.base.scale.set(d.w, bb, 0.025);           k.base.position.set(0, bb / 2, 0.0155);
  k.rail.scale.set(d.w, rl, 0.025);           k.rail.position.set(0, wh, 0.0155);
  k.crown.scale.set(d.w, ch, 0.05);           k.crown.position.set(0, d.h - ch / 2, 0.028);
  k.fillet.scale.set(d.w, ch * 0.18, 0.03);   k.fillet.position.set(0, d.h - ch - ch * 0.09, 0.018);
}
function fitWallpaper(w) {
  const tex = w.wall.material.map;
  if (!tex) return;
  if (!w.hasWp) { const d = dims[w.i];  tex.repeat.set(d.w / 0.5, d.h / 0.5);  tex.offset.set(0, 0);  return; }   // 기본 다마스크 무늬: 벽 크기에 맞춰 반복(한 칸 50cm)
  const A = dims[w.i].w / dims[w.i].h, I = w.wpAspect;       // A: 벽 비율, I: 이미지 비율
  if (I > A) { tex.repeat.set(A / I, 1); tex.offset.set((1 - A / I) / 2, 0); }
  else       { tex.repeat.set(1, I / A); tex.offset.set(0, (1 - I / A) / 2); }
}

function loadWallpaper(i, url, onDone) {             // onDone(성공 여부)
  const w = walls[i];
  w.wpSrc = url;                                     // 세이브할 때 쓰기 위해 출처 기억
  loader.load(url, tex => {
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = maxAniso;
    const m = w.wall.material;
    if (m.map) m.map.dispose();
    m.map = tex;  m.color.set(0xffffff);             // 색을 흰색으로 해야 벽지 원래 색이 보임
    m.needsUpdate = true;
    w.wpAspect = tex.image.width / tex.image.height;
    w.hasWp = true;  w.deco.group.visible = false;   // 벽 이미지가 들어오면 기본 장식(무늬·패널·몰딩)은 숨김
    fitWallpaper(w);
    if (url.startsWith('blob:')) {                   // 업로드 파일이면 이전 임시 URL 정리
      if (wpBlobs[i]) URL.revokeObjectURL(wpBlobs[i]);
      wpBlobs[i] = url;
    }
    if (onDone) onDone(true);
  }, undefined, () => { if (onDone) onDone(false); });
}

ORDER.forEach(i => {                                 // 벽마다 [파일 선택] 한 줄
  const row = document.createElement('div');
  row.className = 'wrow';
  const up = makeUpload(NAMES[i] + ' 벽지', '기본 벽지', url => loadWallpaper(i, url));
  wpStatus[i] = up.span;
  row.append(up.label);
  $('wallList').appendChild(row);
});

/* (3) 탭 4개(벽 · 액자 · 바닥 · 천장): 누르면 해당 목록이 펼쳐지고, 같은 탭을 다시 누르면 접힘 ('액자이미지'는 액자가 있을 때만 보임) */
const TABS = { wall: ['tabWall', 'wallList'], frame: ['tabFrame', 'frameList'], floor: ['tabFloor', 'floorList'], ceil: ['tabCeil', 'ceilList'] };
function showTab(name) {
  const cur = Object.keys(TABS).find(k => $(TABS[k][0]).classList.contains('on')) || '';
  const next = cur === name ? '' : name;
  for (const k in TABS) { $(TABS[k][0]).classList.toggle('on', next === k); $(TABS[k][1]).hidden = next !== k; }
}
Object.keys(TABS).forEach(k => { $(TABS[k][0]).onclick = () => showTab(k); });

FLOORS.forEach((f, i) => {                       // '바닥' 탭: 재질마다 버튼 하나 (누르면 바로 바닥이 바뀜)
  const b = document.createElement('button');
  b.className = 'fbtn';  b.innerHTML = `<i style="background:${f.swatch}"></i>${f.name}`;
  b.onclick = () => setFloor(i);
  f.btn = b;  $('floorList').appendChild(b);
});
setFloor(curFloor);                              // 현재 재질 버튼에 선택 표시
CEILINGS.forEach((c, i) => {                      // '천장' 탭: 종류마다 버튼 하나 (누르면 바로 천장이 바뀜)
  const b = document.createElement('button');
  b.className = 'fbtn';  b.innerHTML = `<i style="background:${c.swatch}"></i>${c.name}`;
  b.onclick = () => setCeiling(i);
  c.btn = b;  $('ceilList').appendChild(b);
});
setCeiling(curCeil);                             // 현재 천장 버튼에 선택 표시
function refreshFrameTab() {
  const has = frames.some(f => f.kind !== 'door' && !f.item);   // 문은 그림이 없으므로 제외
  $('tabFrame').hidden = !has;
  if (!has && !$('frameList').hidden) showTab('frame');   // 액자가 없어지면 열려 있던 목록도 접음
}

/* ---------- 카메라 컨트롤 (중앙 시점에서만 드래그로 둘러보기) ---------- */
let yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;  // yaw: 좌우, pitch: 상하 회전각
let dragFrame = null, dragProp = null;  const grab = { x: 0, y: 0 };               // 끌고 있는 액자 / 잡은 지점과 액자 중심의 차이
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const aim = e => { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); };
const wallOk = i => walls[i].group.visible && alphas[i] > 0.5;     // 보이는(투명해지지 않은) 벽만 대상
canvas.addEventListener('pointerdown', e => {
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  aim(e);
  const fh = ray.intersectObjects(frames.filter(f => wallOk(f.i)).map(f => f.group), true)[0];
  const ph = mode === 'wall' ? null : ray.intersectObjects(props.map(p => p.group), true)[0];
  const wh = ray.intersectObjects(walls.filter((w, i) => wallOk(i)).map(w => w.wall))[0];   // 벽이 가리는지 확인
  const owner = (h, key) => { let o = h && h.object; while (o && !o.userData[key]) o = o.parent; return o && o.userData[key]; };
  const fr = owner(fh, 'frame'), pr = owner(ph, 'prop');
  const useProp = pr && (!fr || ph.distance < fh.distance);          // 겹치면 더 가까운 쪽
  const hit = useProp ? ph : fh;
  if ((fr || pr) && (!wh || hit.distance < wh.distance)) {
    if (useProp) {                                   // 바닥 소품을 눌렀으면 끌기 시작
      dragProp = pr;  selectProp(pr);
      grab.x = pr.group.position.x - ph.point.x;  grab.y = pr.group.position.z - ph.point.z;
    } else {                                         // 액자를 눌렀으면 액자 끌기 시작
      dragFrame = fr;  selectFrame(fr);
      const p = walls[fr.i].group.worldToLocal(fh.point.clone());
      grab.x = fr.group.position.x - p.x;  grab.y = fr.group.position.y - p.y;
    }
  } else { selectFrame(null); selectProp(null); dragging = true; }     // 아니면 기존처럼 둘러보기
});
canvas.addEventListener('pointermove', e => {
  if (dragProp) {                                    // 바닥 위로 끌어 옮기기
    aim(e);
    const h = ray.intersectObject(floor)[0];
    if (h) placeProp(dragProp, h.point.x + grab.x, h.point.z + grab.y);
    return;
  }
  if (dragFrame) {                                   // 마우스가 가리키는 벽 위치로 이동 (다른 벽으로도 옮겨짐)
    aim(e);
    const h = ray.intersectObjects(walls.filter((w, i) => wallOk(i)).map(w => w.wall))[0];
    if (h) {
      const wi = walls.findIndex(w => w.wall === h.object), p = walls[wi].group.worldToLocal(h.point.clone());
      const same = wi === dragFrame.i;
      placeFrame(dragFrame, wi, p.x + (same ? grab.x : 0), p.y + (same ? grab.y : 0));
    }
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (mode === 'center') { yaw += dx * 0.005; pitch = clamp(pitch + dy * 0.005, -1.2, 1.2); }
  else if (mode === 'top') { orbit.yaw -= dx * 0.005; orbit.pitch = clamp(orbit.pitch + dy * 0.005, 0.12, 1.5); }   // 3D: 끌면 방 둘레를 돌며 봄
  else if (mode === 'wall') { view2D.px -= dx * view2D.wpp; view2D.py += dy * view2D.wpp; }                        // 2D: 끄는 방향으로 벽면이 따라 움직임
});
['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { dragging = false; dragFrame = dragProp = null; }));

/* ---------- 2D오브젝트: 벽에 붙는 오브젝트 10종 (2D 벽면 보기에서만 메뉴에 나타남) ----------
 * 액자·문과 똑같이 '벽 그룹의 자식'이라 끌어서 옮기고(다른 벽으로도), 수정·삭제할 수 있어요.
 * 각 항목: label 이름 / labels 크기칸 이름 / def 기본 크기(cm) / min·max 허용 크기(cm) / cy 기본 높이(m) / round 원형(가로=세로)
 *          build({g, w, h, M, add}) → 도형으로 모양을 만듦 (벽 표면이 z=0, 바깥쪽이 +z, 중심이 (0,0), 크기 w×h는 m 단위)
 * ★ 각 build에서 가장 먼저 만든 재질 M(...)이 '선택했을 때 빛나는 재질'이 됩니다. */
const cvTex = (cw, ch, draw) => {                    // 캔버스에 그림을 그려 텍스처로 만들기
  const c = document.createElement('canvas');  c.width = cw;  c.height = ch;
  draw(c.getContext('2d'), cw, ch);
  const t = new THREE.CanvasTexture(c);  t.encoding = THREE.sRGBEncoding;  t.anisotropy = maxAniso;
  return t;
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const WALL_ITEMS = {

const itemNo = {};                                   // 종류별 이름 번호
function clearGroup(g) {                             // 그룹 안의 도형을 모두 지우고 메모리 정리
  while (g.children.length) {
    const c = g.children[0];  g.remove(c);
    c.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  }
}
function buildItem(f) {                              // f.fw × f.fh 크기로 모양 만들기 (크기를 바꿀 때마다 다시 만듦)
  clearGroup(f.group);
  const mats = [], g = f.group;
  const M = (c, o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o)); mats.push(m); return m; };
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); g.add(m); return m; };
  WALL_ITEMS[f.kind].build({ g, w: f.fw, h: f.fh, M, add });
  f.woodMat = mats[0];                               // 선택하면 이 재질이 빛남
}
function setItemSize(f, wCm, hCm) {                  // 크기 적용: 허용 범위와 벽 크기 안으로 맞춤
  const s = WALL_ITEMS[f.kind], d = dims[f.i];
  let w = clamp(wCm, s.min[0], s.max[0]) / 100, h = clamp(hCm, s.min[1], s.max[1]) / 100;
  if (s.round) { w = Math.min(w, d.w * 0.95, d.h * 0.95);  h = w; }
  else { w = Math.min(w, d.w * 0.95);  h = Math.min(h, d.h * 0.95); }
  f.fw = w;  f.fh = h;  f.aspect = w / h;
  buildItem(f);
  f.title = `${f.name} (${Math.round(w * 100)}cm × ${Math.round(h * 100)}cm)`;
}
function createWallItem(key, wCm, hCm, name) {       // 2D오브젝트 만들기: 지금 보는 벽에 생성
  const s = WALL_ITEMS[key], wi = facingWall(), d = dims[wi];
  const f = { i: wi, item: true, kind: key, label: s.label, group: new THREE.Group(), aspect: 1, fw: 1, fh: 1 };
  itemNo[key] = (itemNo[key] || 0) + 1;
  f.name = (name || '').trim().slice(0, 20) || `${s.label} ${itemNo[key]}`;
  setItemSize(f, wCm, hCm);
  f.group.userData.frame = f;                        // 액자와 같은 방식으로 선택·끌기·삭제됨
  const n = frames.filter(o => o.i === wi).length;
  frames.push(f);
  placeFrame(f, wi, ((n % 5) - 2) * 0.5, Math.min(s.cy, d.h * 0.8));
  selectFrame(f);
}
